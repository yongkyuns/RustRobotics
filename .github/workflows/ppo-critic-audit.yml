name: Paired PPO critic initialization audit
on:
  push:
    branches: ["audit/ppo-critic-prefit"]
    paths: [".github/workflows/ppo-critic-audit.yml"]
permissions:
  contents: read
  actions: read
jobs:
  critic:
    name: Critic comparison seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [201, 202, 203, 204]
    env:
      CARGO_TERM_COLOR: never
      PPO_CRITIC_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - uses: actions/download-artifact@v4
        with:
          name: ppo-rust-audit
          run-id: 34267319264
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-audit
      - name: Freeze provenance and verify the prior reference
        shell: bash
        run: |
          export PPO_CRITIC_OUTPUT="$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/data"
          echo "PPO_CRITIC_OUTPUT=$PPO_CRITIC_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$PPO_CRITIC_OUTPUT" "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/provenance"
          git rev-parse HEAD > "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/provenance/commit.txt"
          rustc -Vv > "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/provenance/rustc.txt"
          git diff d724c517c27b182145d4054a66d3937563381dfd -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/model.rs rust_robotics_train/src/env.rs Cargo.lock > "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/provenance/production-diff.txt"
          test ! -s "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/provenance/production-diff.txt"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'prior-audit'
          manifest=json.loads((root/'manifest.json').read_text())
          for path,digest in manifest.items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==digest,path
          print('prior manifest verified',len(manifest))
          PY
          cp "$RUNNER_TEMP/prior-audit/data/stable-start/episodes.tsv" "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/provenance/prior-episodes.tsv"
          cp "$RUNNER_TEMP/prior-audit/manifest.json" "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/provenance/prior-manifest.json"
          python3 scripts/prepare_ppo_critic_audit.py
          cargo fmt --all
          cp rust_robotics_train/src/trainer.rs rust_robotics_train/src/ppo_critic_audit.rs rust_robotics_train/src/model.rs rust_robotics_train/src/env.rs rust_robotics_train/src/algorithm.rs rust_robotics_train/src/ppo_distribution.rs rust_robotics_train/src/backend.rs Cargo.lock "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/provenance/"
          cp scripts/prepare_ppo_critic_audit.py .github/workflows/ppo-critic-audit.yml "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/provenance/"
      - name: Strict checks and unchanged unit regressions
        shell: bash
        run: |
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/clippy.log"
          cargo test --locked -p rust_robotics_train --lib 2>&1 | tee "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/unit-tests.log"
          grep -F 'test result: ok. 60 passed; 0 failed; 1 ignored;' "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/unit-tests.log"
      - name: Execute the fixed critic-fit and continuation protocol
        shell: bash
        run: |
          cargo test --locked --release -p rust_robotics_train --lib trainer::critic_audit::execute_paired_critic_diagnostic -- --ignored --exact --test-threads=1 --show-output 2>&1 | tee "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/measurement.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/critic-${PPO_CRITIC_SEED}/measurement.log"
      - name: Require exact reproduction of every prior fresh-arm result
        shell: bash
        run: |
          python3 - <<'PY'
          import os,csv,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/('critic-'+os.environ['PPO_CRITIC_SEED'])
          seed=os.environ['PPO_CRITIC_SEED']
          def load(p):
              return list(csv.DictReader(p.open(),delimiter='\t'))
          before=[r for r in load(root/'provenance/prior-episodes.tsv') if r['training_seed']==seed]
          after=load(root/'data/fresh/episodes.tsv')
          assert len(before)==len(after)==160
          assert before==after,'fresh continuation differs from prior stable-start audit'
          other=load(root/'data/prefitted/episodes.tsv')
          assert len(other)==160
          assert [r for r in before if r['updates']=='0']==[r for r in other if r['updates']=='0']
          for arm in ['fresh','prefitted']:
              rows=load(root/'data'/arm/'updates.tsv')
              assert len(rows)==512
              assert [int(r['update']) for r in rows]==list(range(1,513))
              assert int(rows[-1]['steps'])==262144
          (root/'replay.json').write_text(json.dumps({'prior_rows_exact':160,'initial_actor_panel_exact':32,'updates_per_arm':512},indent=2)+'\n')
          print('every fresh episode and initial paired evaluation reproduced exactly')
          PY
      - name: Restore production source and preserve all provenance
        if: always()
        shell: bash
        run: |
          git checkout -- rust_robotics_train/src/trainer.rs
          git diff --exit-code -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/model.rs rust_robotics_train/src/env.rs Cargo.lock
          python3 - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/('critic-'+os.environ['PPO_CRITIC_SEED'])
          root.mkdir(exist_ok=True)
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and p.name!='manifest.json'}
          (root/'manifest.json').write_text(json.dumps(files,indent=2)+'\n')
          print('retained files',len(files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-critic-${{ matrix.seed }}
          path: ${{ runner.temp }}/critic-${{ matrix.seed }}/
          retention-days: 30
          if-no-files-found: error
