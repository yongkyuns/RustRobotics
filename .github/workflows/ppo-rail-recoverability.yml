name: PPO rail recoverability diagnosis
on:
  push:
    branches: ["audit/ppo-rail-recoverability-20260919"]
    paths: [".github/workflows/ppo-rail-recoverability.yml", "audits/rail_recoverability/native.rs", "audits/rail_recoverability/prepare.py", "audits/rail_recoverability/design.py"]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      RAIL_BUILD: /tmp/rail-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Require unchanged plant and exact branch controls
        run: |
          mkdir -p "$RAIL_BUILD"
          python audits/rail_recoverability/prepare.py 2>&1 | tee "$RAIL_BUILD/preparation.log"
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$RAIL_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee "$RAIL_BUILD/tests.log"
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics 2>&1 | tee "$RAIL_BUILD/integration.log"
          cargo fmt --all -- --check
          git diff --check
      - name: Export the actual diagnostic test endpoint
        run: |
          cargo test --locked --release -p rust_robotics_train --lib --no-run --message-format=json > "$RAIL_BUILD/build.jsonl"
          python - <<'PY'
          from pathlib import Path
          import json,os,shutil
          root=Path(os.environ['RAIL_BUILD']);rows=[json.loads(l) for l in (root/'build.jsonl').read_text().splitlines()]
          paths=[r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('executable') and r['target']['name']=='rust_robotics_train']
          assert len(paths)==1,paths
          shutil.copyfile(paths[0],root/'runner')
          PY
          chmod +x "$RAIL_BUILD/runner"
          ldd "$RAIL_BUILD/runner" > "$RAIL_BUILD/linkage.txt"
      - name: Preserve sources and restore protected files
        if: always()
        run: |
          mkdir -p "$RAIL_BUILD"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RAIL_BUILD'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2)+'\n')
          PY
          git restore -- rust_robotics_train/src/lib.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_core rust_robotics_algo rust_robotics_sim Cargo.lock docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rail-build
          path: /tmp/rail-build/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
  diagnose:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Rail diagnostic seed ${{ matrix.seed }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [41001, 41002, 41003, 41004, 41005, 41006, 41007, 41008]
    env:
      RAIL_SEED: ${{ matrix.seed }}
      RAIL_BUILD: /tmp/rail-build
      RAIL_OUT: /tmp/rail-${{ matrix.seed }}
      RAIL_PRIOR: /tmp/rail-prior
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rail-build
          path: /tmp/rail-build
      - name: Verify native executable and immutable trained policy evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RAIL_OUT" "$RAIL_PRIOR"
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path
          build=Path(os.environ['RAIL_BUILD']);out=Path(os.environ['RAIL_OUT']);prior=Path(os.environ['RAIL_PRIOR'])
          for n,h in json.loads((build/'manifest.json').read_text()).items():assert hashlib.sha256((build/n).read_bytes()).hexdigest()==h,n
          for n in ['manifest.json','baseline.txt','commit.txt']:shutil.copyfile(build/n,out/('build-'+n))
          ids={41001:(10586884648,'1775a8abfb8108c1c8e22d7f648158f4af95760cb2e4a1d5babfc350479696d5'),41002:(10587601850,'290d32e94d51fefc117a9402026bc80a2db4fe4a749eb549ac9c4e3719bd2289'),41003:(10587691847,'db2c927a6987e016e5aa652ff7c0f765afdff768bfdb0d6392f6a7b7a32a1519'),41004:(10587054534,'cf819e0d190824f78292237f60260e9295f46a88eb32bb5cff4aa50c38c449c6'),41005:(10587154734,'8fd8349eee9cf377d40c889d98f5e532463236c198f1e10d6104f8041911238e'),41006:(10587079979,'0691ac00cc7b90ae75b6520c08abd29be5f57e290b19e0dad8759300a042599e'),41007:(10587442596,'c96f278fd3453c52e2bda93e6843ade3eba84502deaff57f7e6b266963d59d68'),41008:(10588490347,'2e3f6a9db8c9365418b1467d6e5debc70b37c07e41cda1d51d5659eca530a393')}
          aid,digest=ids[int(os.environ['RAIL_SEED'])];archive=out/'prior-policy.zip'
          with archive.open('wb') as f:subprocess.run(['gh','api',f'repos/yongkyuns/RustRobotics/actions/artifacts/{aid}/zip'],stdout=f,check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest
          with zipfile.ZipFile(archive) as z:
              names=z.namelist();assert len(names)==len(set(names));m=json.loads(z.read('manifest.json'))
              assert set(names)==set(m)|{'manifest.json'}
              for n,h in m.items():assert hashlib.sha256(z.read(n)).hexdigest()==h,n
              for n in ['actor-4096.bin','evaluation.csv','config.json']:(prior/n).write_bytes(z.read(n))
          (out/'input.json').write_text(json.dumps({'seed':int(os.environ['RAIL_SEED']),'artifact':aid,'sha256':digest,'source_run':35453178361})+'\n')
          PY
          chmod +x "$RAIL_BUILD/runner"
      - name: Execute all original cases and predeclared diagnostic branches
        run: |
          "$RAIL_BUILD/runner" rail_diagnostic::emit --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RAIL_OUT/execution.log"
          grep -F "RAIL DIAGNOSTIC COMPLETE $RAIL_SEED" "$RAIL_OUT/execution.log"
      - name: Retain every successful and failed result
        if: always()
        run: |
          mkdir -p "$RAIL_OUT"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RAIL_OUT'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rail-${{ matrix.seed }}
          path: ${{ env.RAIL_OUT }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
