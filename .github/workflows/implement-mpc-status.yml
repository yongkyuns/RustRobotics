name: Implement MPC status API

on:
  push:
    branches: ["improve/control-runtime-status"]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/control-runtime-status
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add fallible MPC API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust_robotics_algo/src/control/inverted_pendulum/mpc.rs')
          s = p.read_text()
          marker = '/// MPC control using quadratic programming with the Clarabel solver.\n'
          insert = '''/// Error returned when the MPC quadratic-program solver does not produce a usable solution.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct MpcSolveError {\n    status: String,\n}\n\nimpl MpcSolveError {\n    fn from_status(status: impl std::fmt::Debug) -> Self {\n        Self {\n            status: format!("{status:?}"),\n        }\n    }\n\n    /// Returns the underlying solver status as a stable diagnostic string.\n    pub fn status(&self) -> &str {\n        &self.status\n    }\n}\n\nimpl std::fmt::Display for MpcSolveError {\n    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n        write!(f, "MPC solver did not produce a usable solution: {}", self.status)\n    }\n}\n\nimpl std::error::Error for MpcSolveError {}\n\n'''
          if 'pub struct MpcSolveError' not in s:
              s = s.replace(marker, insert + marker, 1)
          s = s.replace(
              'pub fn mpc_control(x: Vector4, model: Model, dt: f32) -> f32 {',
              'pub fn try_mpc_control(x: Vector4, model: Model, dt: f32) -> Result<f32, MpcSolveError> {',
              1,
          )
          old = '''    match solver.solution.status {\n        SolverStatus::Solved | SolverStatus::AlmostSolved => solver.solution.x[u_idx] as f32,\n        _ => {\n            // Solver failed - return 0 as safe fallback\n            0.0\n        }\n    }\n}\n\n#[cfg(test)]'''
          new = '''    match solver.solution.status {\n        SolverStatus::Solved | SolverStatus::AlmostSolved => Ok(solver.solution.x[u_idx] as f32),\n        ref status => Err(MpcSolveError::from_status(status)),\n    }\n}\n\n/// Compatibility helper that preserves the historical zero-force fallback.\n///\n/// New runtime code should prefer [`try_mpc_control`] so solver failure cannot be\n/// mistaken for a valid zero-force optimum.\npub fn mpc_control(x: Vector4, model: Model, dt: f32) -> f32 {\n    try_mpc_control(x, model, dt).unwrap_or(0.0)\n}\n\n#[cfg(test)]'''
          if old not in s:
              raise SystemExit('expected MPC result block not found')
          s = s.replace(old, new, 1)
          test_marker = '''    #[test]\n    fn test_mpc_control() {'''
          test_insert = '''    #[test]\n    fn fallible_api_reports_a_valid_solution() {\n        let x = vector![0.0, 0.1, 0.1, 0.0];\n        let result = try_mpc_control(x, Model::default(), 0.1);\n        let u = result.expect("nominal MPC solve should succeed");\n        assert!(u.is_finite());\n    }\n\n    #[test]\n    fn compatibility_api_matches_fallible_api_on_success() {\n        let x = vector![0.0, 0.1, 0.1, 0.0];\n        let model = Model::default();\n        let expected = try_mpc_control(x, model, 0.1).expect("nominal solve");\n        let actual = mpc_control(x, model, 0.1);\n        assert!((actual - expected).abs() < f32::EPSILON);\n    }\n\n'''
          if 'fallible_api_reports_a_valid_solution' not in s:
              s = s.replace(test_marker, test_insert + test_marker, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test -p rust_robotics_algo control::inverted_pendulum::mpc
          cargo clippy -p rust_robotics_algo --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust_robotics_algo/src/control/inverted_pendulum/mpc.rs
          git commit -m "Expose MPC solver failures" || exit 0
          git push origin HEAD:improve/control-runtime-status
