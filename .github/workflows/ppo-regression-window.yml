name: PPO historical regression-window replay
on:
  push:
    branches: ["audit/ppo-regression-window-20260920"]
    paths: [".github/workflows/ppo-regression-window.yml", "audits/regression_window/native.rs", "audits/regression_window/prepare.py"]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      HORIZON_BUILD: /tmp/window-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Require observation-only replay and optimizer-history controls
        run: |
          mkdir -p "$HORIZON_BUILD"
          python audits/regression_window/prepare.py 2>&1 | tee "$HORIZON_BUILD/preparation.log"
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$HORIZON_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee "$HORIZON_BUILD/native-tests.log"
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics 2>&1 | tee "$HORIZON_BUILD/integration.log"
          cargo fmt --all -- --check
          git diff --check
      - name: Export tested executable and discover exact endpoint
        run: |
          cargo test --locked --release -p rust_robotics_train --lib --no-run --message-format=json > "$HORIZON_BUILD/build.jsonl"
          python - <<'PY'
          import os,json,shutil,subprocess
          from pathlib import Path
          out=Path(os.environ['HORIZON_BUILD'])
          rows=[json.loads(line) for line in (out/'build.jsonl').read_text().splitlines()]
          found=[r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('executable') and r['target']['name']=='rust_robotics_train']
          assert len(found)==1,found
          shutil.copyfile(found[0],out/'runner');(out/'runner').chmod(0o755)
          listed=subprocess.check_output([str(out/'runner'),'--list']).decode()
          (out/'test-list.txt').write_text(listed)
          endpoints=[line.removesuffix(': test') for line in listed.splitlines() if line.endswith('::emit_regression_window: test')]
          assert len(endpoints)==1,endpoints
          (out/'endpoint.txt').write_text(endpoints[0]+'\n')
          (out/'linkage.txt').write_bytes(subprocess.check_output(['ldd',str(out/'runner')]))
          PY
      - name: Preserve all build evidence and restore protected sources
        if: always()
        run: |
          mkdir -p "$HORIZON_BUILD"
          git restore -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/ppo_rollout_pool.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_core rust_robotics_algo rust_robotics_sim Cargo.lock docs
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['HORIZON_BUILD'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-window-build
          path: /tmp/window-build/
          retention-days: 30
          if-no-files-found: error
  replay:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [41004, 41006]
    name: Historical window seed ${{ matrix.seed }}
    env:
      HORIZON_SEED: ${{ matrix.seed }}
      HORIZON_OUT: /tmp/window-${{ matrix.seed }}
      HORIZON_PRIOR: /tmp/window-prior
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: regression-window-build
          path: /tmp/window-build
      - name: Verify immutable endpoint and historical reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,hashlib,subprocess,zipfile,shutil
          from pathlib import Path
          build=Path('/tmp/window-build');out=Path(os.environ['HORIZON_OUT']);prior=Path(os.environ['HORIZON_PRIOR'])
          out.mkdir(parents=True,exist_ok=True);prior.mkdir(parents=True,exist_ok=True)
          for n,h in json.loads((build/'manifest.json').read_text()).items():assert hashlib.sha256((build/n).read_bytes()).hexdigest()==h,n
          for n in ['commit.txt','manifest.json','endpoint.txt']:shutil.copyfile(build/n,out/('build-'+n))
          ids={41004:(10617114297,'8b2ab3740a20985b68ec2d4624f394ce17f1e2f13a4006385195762d6a27dc94'),41006:(10617228922,'8e362b04389c36358f8b48177c19a8d8cc02447a090da90de8c8b85b79812d79')}
          artifact,digest=ids[int(os.environ['HORIZON_SEED'])]
          raw=out/'historical-support1024.zip'
          with raw.open('wb') as f:subprocess.run(['gh','api',f'repos/yongkyuns/RustRobotics/actions/artifacts/{artifact}/zip'],stdout=f,check=True)
          assert hashlib.sha256(raw.read_bytes()).hexdigest()==digest
          with zipfile.ZipFile(raw) as z:
              m=json.loads(z.read('manifest.json'));assert set(z.namelist())==set(m)|{'manifest.json'}
              for n,h in m.items():assert hashlib.sha256(z.read(n)).hexdigest()==h,n
              names=['updates.csv','evaluation.csv']+[f'{kind}-{cp}.bin' for kind in ['actor','critic'] for cp in [0,1024,4096,4128,4224]]
              for n in names:(prior/n).write_bytes(z.read(n))
          (out/'source.json').write_text(json.dumps({'artifact_id':artifact,'sha256':digest,'run':35548063439,'source_commit':'0a4445f6c5ab83650133a696faaeb764fd5b6c26'},sort_keys=True,indent=2)+'\n')
          PY
          chmod +x /tmp/window-build/runner
      - name: Reconstruct live history and record every window update once
        run: |
          /tmp/window-build/runner "$(cat /tmp/window-build/endpoint.txt)" --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$HORIZON_OUT/execution.log"
          grep -F "REGRESSION WINDOW COMPLETE $HORIZON_SEED" "$HORIZON_OUT/execution.log"
      - name: Preserve all outcomes including stopped or failed replay
        if: always()
        run: |
          mkdir -p "$HORIZON_OUT"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['HORIZON_OUT'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-window-${{ matrix.seed }}
          path: ${{ env.HORIZON_OUT }}/
          retention-days: 30
          if-no-files-found: error
