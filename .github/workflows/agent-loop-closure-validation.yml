name: Validate observation-derived loop closure

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  patch-and-test:
    name: Patch and validate loop closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/observation-derived-loop-closure

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply exact loop closure patch
        run: python scripts/patch_observation_loop_closure.py

      - name: Check touched source formatting
        run: rustfmt --edition 2021 --check rust_robotics_algo/src/slam/loop_closure.rs

      - name: Run loop closure regressions
        run: cargo test -p rust_robotics_algo loop_closure --lib

      - name: Verify isolated diff
        run: |
          git diff --check
          git status --short
          test "$(git diff --name-only | sort)" = "rust_robotics_algo/src/slam/loop_closure.rs"

      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-loop-closure-validation.yml scripts/patch_observation_loop_closure.py
          git add rust_robotics_algo/src/slam/loop_closure.rs
          git commit -m "Make loop closures observation-derived"
          git push origin HEAD:fix/observation-derived-loop-closure
