name: Run final source repair

on:
  push:
    branches: ["ci/thorough-coverage"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run extracted final repair'
    runs-on: ubuntu-latest
    env:
      MUJOCO_VERSION: 3.4.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/thorough-coverage
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          timeout 10m sudo apt-get update -o Acquire::Retries=3
          timeout 15m sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Install MuJoCo
        run: |
          curl -L --fail \
            -o "$RUNNER_TEMP/mujoco.tar.gz" \
            "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"
          tar -xzf "$RUNNER_TEMP/mujoco.tar.gz" -C "$RUNNER_TEMP"
          echo "MUJOCO_HOME=$RUNNER_TEMP/mujoco-${MUJOCO_VERSION}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mujoco-${MUJOCO_VERSION}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Apply reviewed repairs
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          raw = Path('.github/workflows/repair-final.yml').read_text()
          start = '      - name: Apply explicit source repairs\n        shell: python\n        run: |\n'
          end = '\n      - name: Format workspace\n'
          if start not in raw or end not in raw:
              raise SystemExit('repair script markers not found')
          block = raw.split(start, 1)[1].split(end, 1)[0]
          script = textwrap.dedent(block)

          old = '    markers = [f"    pub(crate) fn {name}(", f"    fn {name}("]\n'
          new = (
              '    markers = [\n'
              '        f"    pub(crate) fn {name}(",\n'
              '        f"    fn {name}(",\n'
              '        f"pub(crate) fn {name}(",\n'
              '        f"fn {name}(",\n'
              '    ]\n'
          )
          if old not in script:
              raise SystemExit('cfg marker list not found in extracted script')
          script = script.replace(old, new, 1)

          old = '            replacement = f"    {CFG_WASM}\\n" + marker\n'
          new = (
              '            indent = "    " if marker.startswith("    ") else ""\n'
              '            replacement = f"{indent}{CFG_WASM}\\n" + marker\n'
          )
          if old not in script:
              raise SystemExit('cfg replacement marker not found in extracted script')
          script = script.replace(old, new, 1)
          script = script.replace('missing method {name}', 'missing function {name}', 1)

          exec(compile(script, 'reviewed-clippy-repair.py', 'exec'), {})

          domain = Path('rust_robotics_sim/src/simulator/pendulum/domain.rs')
          text = domain.read_text()
          old = 'use super::super::ppo_trainer::{PpoReplicaStatus, PpoTrainerCoordinator};'
          new = (
              'use super::super::ppo_trainer::PpoTrainerCoordinator;\n'
              '#[cfg(target_arch = "wasm32")]\n'
              'use super::super::ppo_trainer::PpoReplicaStatus;'
          )
          if old not in text:
              raise SystemExit('PpoReplicaStatus import marker not found')
          text = text.replace(old, new, 1)
          old = 'use rust_robotics_core::{PolicySnapshot, PpoMetrics};'
          new = (
              'use rust_robotics_core::PolicySnapshot;\n'
              '#[cfg(target_arch = "wasm32")]\n'
              'use rust_robotics_core::PpoMetrics;'
          )
          if old not in text:
              raise SystemExit('PpoMetrics import marker not found')
          domain.write_text(text.replace(old, new, 1))

          pendulum_mod = Path('rust_robotics_sim/src/simulator/pendulum/mod.rs')
          text = pendulum_mod.read_text()
          old = (
              'pub(crate) use domain::ControllerKind;\n'
              '#[cfg(target_arch = "wasm32")]\n'
              'pub(crate) use domain::{PendulumCardState, PendulumPatch};'
          )
          new = (
              '#[cfg(target_arch = "wasm32")]\n'
              'pub(crate) use domain::{ControllerKind, PendulumCardState, PendulumPatch};'
          )
          if old not in text:
              raise SystemExit('ControllerKind re-export marker not found')
          pendulum_mod.write_text(text.replace(old, new, 1))

          theme = Path('rust_robotics_sim/src/theme.rs')
          text = theme.read_text()
          old = '    visuals.selection.stroke = Stroke::new(\n        1.0,\n'
          new = '    visuals.selection.stroke = Stroke::new(\n        1.0_f32,\n'
          if old not in text:
              raise SystemExit('selection stroke f32 marker not found')
          theme.write_text(text.replace(old, new, 1))

      - name: Format workspace
        run: cargo fmt --all

      - name: Verify strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify legacy WASM configuration
        run: cargo check -p rust_robotics_sim --target wasm32-unknown-unknown --no-default-features

      - name: Verify patch
        run: git diff --check

      - name: Commit source repairs
        run: |
          git checkout -- .github/workflows/rust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust_robotics_algo rust_robotics_core rust_robotics_sim
          git commit -m "Fix strict Clippy findings"
          git push origin HEAD:ci/thorough-coverage
