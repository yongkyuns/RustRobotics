name: Qualify legacy seeded regressions

on:
  push:
    branches: ["test/seed-legacy-filter-regressions"]
    paths: [".github/workflows/qualify-legacy-seeds.yml"]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_robotics_algo
      - name: Prepare and test unchanged-threshold seeded regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          out = Path(os.environ['RUNNER_TEMP']) / 'legacy-seed-evidence'
          out.mkdir()
          report = {'input_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'runs': [], 'outcome': 'in_progress'}
          def save():
              (out / 'results.json').write_text(json.dumps(report, indent=2) + '\n')
          def run(label, command):
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=900)
              (out / (label + '.log')).write_text(result.stdout)
              report['runs'].append({'label': label, 'command': command, 'exit_status': result.returncode})
              save()
              print(result.stdout, flush=True)
              if result.returncode:
                  raise RuntimeError(f'{label} failed with status {result.returncode}')
          files = [
              'rust_robotics_algo/src/slam/ekf_slam.rs',
              'rust_robotics_algo/src/slam/ekf_slam_rng_tests.rs',
              'rust_robotics_algo/src/localization/particle_filter.rs',
              'rust_robotics_algo/src/localization/particle_filter_seeded_tests.rs',
              'rust_robotics_sim/src/simulator/common/noise.rs',
              'scripts/check_numerical_mutations.py',
          ]
          try:
              run('prepare', ['python3', 'scripts/prepare_legacy_seeds.py'])
              run('format', ['cargo', 'fmt', '--all'])
              run('algorithm-tests', ['cargo', 'test', '--locked', '-p', 'rust_robotics_algo', '--lib', '--', '--show-output'])
              run('algorithm-clippy', ['cargo', 'clippy', '--locked', '-p', 'rust_robotics_algo', '--all-targets', '--', '-D', 'warnings'])
              run('python-self-tests', ['python3','-m','unittest','discover','-s','scripts','-p','test_numerical_mutations.py','-v'])
              run('diff-check', ['git','diff','--check'])
              changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
              assert changed <= set(files), changed
              report['outcome'] = 'success'
          except BaseException as error:
              report['outcome'] = 'failed'
              report['error'] = str(error)
              raise
          finally:
              report['qualified_files'] = {}
              for name in files:
                  p = Path(name)
                  b = p.read_bytes()
                  dest = out / 'sources' / p
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(b)
                  report['qualified_files'][name] = {'sha256': hashlib.sha256(b).hexdigest(), 'git_blob': hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()}
              (out / 'prepared.patch').write_text(subprocess.check_output(['git','diff'], text=True))
              save()
          PY
      - name: Preserve preparation and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-seed-evidence
          path: ${{ runner.temp }}/legacy-seed-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Publish only qualified source edits to the feature branch
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/test/seed-legacy-filter-regressions'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rust_robotics_algo/src/slam/ekf_slam.rs rust_robotics_algo/src/slam/ekf_slam_rng_tests.rs rust_robotics_algo/src/localization/particle_filter.rs rust_robotics_algo/src/localization/particle_filter_seeded_tests.rs rust_robotics_sim/src/simulator/common/noise.rs scripts/check_numerical_mutations.py
          git diff --cached --check
          git commit -m 'test: seed legacy filter regressions through private RNG seams'
          auth=$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/test/seed-legacy-filter-regressions
          git rev-parse HEAD
