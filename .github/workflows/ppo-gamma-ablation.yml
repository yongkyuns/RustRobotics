name: PPO gamma development ablation

on:
  push:
    branches: ["experiment/ppo-gamma-0995"]
    paths: [".github/workflows/ppo-gamma-ablation.yml"]

permissions:
  contents: read
  actions: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Record immutable experiment provenance
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ppo-gamma-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/ppo-gamma-evidence/head.txt"
          rustc -Vv | tee "$RUNNER_TEMP/ppo-gamma-evidence/rustc.txt"
          cargo fmt --all -- --check
          git diff --exit-code
      - name: Retrieve prior frozen std4 reference without retraining it
        uses: actions/download-artifact@v4
        with:
          name: ppo-exploration-ablation
          run-id: 34240275488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-ppo-exploration
      - name: Repeat gamma 0.99 baseline, then measure gamma 0.995
        shell: bash
        run: |
          python3 scripts/run_ppo_gamma_ablation.py \
            --reference "$RUNNER_TEMP/prior-ppo-exploration/ablation/std4" \
            --output "$RUNNER_TEMP/ppo-gamma-evidence/experiment" \
            2>&1 | tee "$RUNNER_TEMP/ppo-gamma-evidence/experiment.log"
          cargo fmt --all -- --check
          git diff --exit-code
      - name: Preserve both panels, controls and all failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppo-gamma-ablation
          path: ${{ runner.temp }}/ppo-gamma-evidence/
          retention-days: 30
          if-no-files-found: error
