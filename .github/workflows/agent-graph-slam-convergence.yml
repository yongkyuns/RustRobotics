name: Validate Graph SLAM convergence patch

on:
  push:
    branches: ["fix/graph-slam-correctness"]
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  patch-and-test:
    name: Patch and validate Graph SLAM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graph-slam-correctness

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply exact convergence patch
        run: python scripts/patch_graph_slam_convergence.py

      - name: Check Graph SLAM formatting
        run: rustfmt --edition 2021 --check rust_robotics_algo/src/slam/graph_slam.rs

      - name: Run Graph SLAM regressions
        run: cargo test -p rust_robotics_algo graph_slam --lib

      - name: Verify isolated diff
        run: |
          git diff --check
          git status --short
          test "$(git diff --name-only | sort)" = "rust_robotics_algo/src/slam/graph_slam.rs"

      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-graph-slam-convergence.yml scripts/patch_graph_slam_convergence.py
          git add rust_robotics_algo/src/slam/graph_slam.rs
          git commit -m "Fix Graph SLAM convergence detection"
          git push origin HEAD:fix/graph-slam-correctness
