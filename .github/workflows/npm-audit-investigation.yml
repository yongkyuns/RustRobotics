name: npm audit investigation

on:
  push:
    branches: ["fix/browser-tooling-audit-22"]
    paths: [".github/workflows/npm-audit-investigation.yml"]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Record baseline audit and dependency paths
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-evidence"
          git rev-parse HEAD
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit
          npm ls --all
          status=0
          npm audit --include=dev --json > "$RUNNER_TEMP/npm-evidence/before.json" || status=$?
          cat "$RUNNER_TEMP/npm-evidence/before.json"
          node -e 'const a=JSON.parse(require("fs").readFileSync(process.argv[1])); if(a.error || !a.metadata || !a.vulnerabilities) process.exit(1)' "$RUNNER_TEMP/npm-evidence/before.json"
          test "$status" -le 1
          npm audit --omit=dev --json
      - name: Generate and verify targeted Playwright update
        shell: bash
        run: |
          npm install --save-dev --save-exact @playwright/test@1.56.1 --ignore-scripts --no-audit
          npm ci --ignore-scripts --no-audit
          npm ls --all
          npm audit --include=dev --json | tee "$RUNNER_TEMP/npm-evidence/after.json"
          npm audit --omit=dev --json
          npx --no-install playwright --version
          npx --no-install playwright test --config playwright.config.mjs --list
          echo '--- GENERATED PACKAGE.JSON ---'
          cat package.json
          echo '--- GENERATED PACKAGE-LOCK.JSON ---'
          cat package-lock.json
          echo '--- END GENERATED FILES ---'
          cp package.json package-lock.json "$RUNNER_TEMP/npm-evidence/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-evidence
          path: ${{ runner.temp }}/npm-evidence/
          retention-days: 14
