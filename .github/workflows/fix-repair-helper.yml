name: Fix final repair helper

on:
  push:
    branches: ["ci/thorough-coverage"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/thorough-coverage
          fetch-depth: 0

      - name: Patch repair helper
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/repair-final.yml')
          text = path.read_text()

          old = '              markers = [f"    pub(crate) fn {name}(", f"    fn {name}("]\n'
          new = (
              '              markers = [\n'
              '                  f"    pub(crate) fn {name}(",\n'
              '                  f"    fn {name}(",\n'
              '                  f"pub(crate) fn {name}(",\n'
              '                  f"fn {name}(",\n'
              '              ]\n'
          )
          if old not in text:
              raise SystemExit('cfg markers not found')
          text = text.replace(old, new, 1)

          old = '                      replacement = f"    {CFG_WASM}\\n" + marker\n'
          new = (
              '                      indent = "    " if marker.startswith("    ") else ""\n'
              '                      replacement = f"{indent}{CFG_WASM}\\n" + marker\n'
          )
          if old not in text:
              raise SystemExit('cfg replacement marker not found')
          text = text.replace(old, new, 1)
          text = text.replace('missing method {name}', 'missing function {name}', 1)

          old = '      - name: Remove repair workflow\n        run: git rm .github/workflows/repair-final.yml\n'
          new = (
              '      - name: Remove repair workflow\n'
              '        run: |\n'
              '          git rm .github/workflows/repair-final.yml\n'
              '          git rm -f .github/repair-trigger\n'
          )
          if old not in text:
              raise SystemExit('cleanup marker not found')
          path.write_text(text.replace(old, new, 1))

      - name: Commit helper fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-repair-helper.yml
          git add .github/workflows/repair-final.yml
          git commit -m "Fix final Clippy repair helper"
          git push origin HEAD:ci/thorough-coverage
