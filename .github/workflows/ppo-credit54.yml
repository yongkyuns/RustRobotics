name: PPO update54 conditional credit (diagnostic)
on:
  push:
    branches: [audit/ppo-clean-reference-20260925]
    paths: [.github/workflows/ppo-credit54.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ppo-credit54-20261006
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  RUSTUP_TOOLCHAIN: 1.98.1
  PPO_REF_OUT: /tmp/credit54/branch-controls
jobs:
  credit:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require compatible CPU family before numerical replay
        run: |
          mkdir -p /tmp/credit54/branch-controls
          git rev-parse HEAD > /tmp/credit54/executed-commit.txt
          lscpu > /tmp/credit54/lscpu.txt
          grep -F 'GenuineIntel' /tmp/credit54/lscpu.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Preserve source and install pinned dependencies
        run: |
          cp audits/clean_reference/{credit54_20261006.py,credit54_equal_batches.py,credit54_bridge.rs,update_audit_20261006.py,local_linearization.py} .github/workflows/ppo-credit54.yml /tmp/credit54/
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee /tmp/credit54/install-torch.log
          python -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0 2>&1 | tee /tmp/credit54/install-reference.log
          python -m pip freeze > /tmp/credit54/python-freeze.txt
      - name: Retrieve frozen transaction and build additive state-continuation ABI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11431717887/zip" -o /tmp/credit54/original-update.zip
          python -m py_compile audits/clean_reference/credit54_20261006.py audits/clean_reference/credit54_equal_batches.py
          python audits/clean_reference/credit54_equal_batches.py prepare --root /tmp/credit54 2>&1 | tee /tmp/credit54/prepare.log
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee /tmp/credit54/clippy.log
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee /tmp/credit54/native-tests.log
          cargo build --locked --release -p rust_robotics_train --lib 2>&1 | tee /tmp/credit54/build.log
          cp target/release/librust_robotics_train.so /tmp/credit54/
          git restore -- rust_robotics_train/Cargo.toml rust_robotics_train/src/lib.rs
          rm audits/clean_reference/bridge.rs
          git diff --exit-code
      - name: Execute exact state capture and fixed conditional Monte Carlo panel
        run: |
          python audits/clean_reference/credit54_equal_batches.py measure --root /tmp/credit54 2>&1 | tee /tmp/credit54/measurement.log
          grep -F 'COMPLETE CONDITIONAL CREDIT AUDIT' /tmp/credit54/measurement.log
      - name: Retain evidence and any failed gate
        if: always()
        run: |
          mkdir -p /tmp/credit54
          git diff > /tmp/credit54/final-worktree.diff
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('/tmp/credit54')
          (p/'manifest.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and f!=p/'manifest.json'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-credit54-20261006
          path: /tmp/credit54/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
