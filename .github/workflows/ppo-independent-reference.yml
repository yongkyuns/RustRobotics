name: PPO independent reference correctness audit

on:
  push:
    branches: ["audit/ppo-independent-reference-20260921"]
    paths:
      - ".github/workflows/ppo-independent-reference.yml"
      - "audits/ppo_reference_audit/**"

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      OUT: /tmp/ppo-reference
      RAW: /tmp/regression-window-41006.zip
      RAW_SHA256: c6ed988a1d4a293b11c5037a8c9886afb31ab83c5b45cb2549427d559b462b96
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1

      - name: Verify production PPO source has not been modified by the audit
        run: |
          git diff --exit-code ca8bc69f8d79a54b62e9e20d4a6b5b64bc1ba8a1 --             rust_robotics_train rust_robotics_core rust_robotics_algo rust_robotics_sim Cargo.lock
          python audits/ppo_reference_audit/static_audit.py

      - name: Run existing native PPO correctness controls
        run: |
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1
          cargo test --locked --release -p rust_robotics_train             --test ppo_learning --test ppo_balancing_diagnostics
          cargo fmt --all -- --check
          git diff --check

      - name: Install only the independent numerical dependency
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.1.3"
          python - <<'PY'
          import numpy
          print("numpy", numpy.__version__)
          PY

      - name: Fetch the immutable harmful-update evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUT"
          gh api repos/yongkyuns/RustRobotics/actions/artifacts/10620305749/zip > "$RAW"
          echo "$RAW_SHA256  $RAW" | sha256sum -c -
          cp audits/ppo_reference_audit/README.md "$OUT/protocol.md"
          cp audits/ppo_reference_audit/STATIC_FINDINGS.md "$OUT/static-findings.md"
          cp audits/ppo_reference_audit/static-findings.json "$OUT/static-findings.json"
          git rev-parse HEAD > "$OUT/audit-commit.txt"
          rustc -Vv > "$OUT/rustc.txt"
          python -V > "$OUT/python.txt"
          python -m pip show numpy > "$OUT/numpy.txt"

      - name: Run independent PPO reconstruction
        id: reference
        run: |
          set +e
          python audits/ppo_reference_audit/reference.py             "$RAW" "$OUT" --expected-sha256 "$RAW_SHA256"             > "$OUT/reference.stdout" 2> "$OUT/reference.stderr"
          code=$?
          set -e
          echo "$code" > "$OUT/reference.exit"
          cat "$OUT/reference.stdout"
          cat "$OUT/reference.stderr" >&2
          exit 0

      - name: Hash retained audit evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["OUT"]); root.mkdir(parents=True,exist_ok=True)
          manifest={}
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name!="manifest.json":
                  manifest[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/"manifest.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-independent-reference
          path: /tmp/ppo-reference/
          retention-days: 30
          if-no-files-found: error

      - name: Enforce independent reference classification
        if: always()
        run: |
          test -f "$OUT/reference.exit"
          test "$(cat "$OUT/reference.exit")" = "0"
