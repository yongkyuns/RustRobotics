name: PPO frozen reflection consistency
on:
  push:
    branches: ["audit/ppo-reflection-consistency-20260919"]
    paths: [".github/workflows/ppo-reflection-consistency.yml", "audits/reflection_consistency/native.rs"]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      REFLECTION_BUILD: /tmp/reflection-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Attach only the frozen diagnostic and preserve sources
        run: |
          mkdir -p "$REFLECTION_BUILD"
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_core rust_robotics_algo rust_robotics_sim Cargo.lock docs
          python - <<'PY'
          from pathlib import Path
          import os,shutil,subprocess
          out=Path(os.environ['REFLECTION_BUILD']);p=Path('rust_robotics_train/src/lib.rs')
          p.write_text(p.read_text()+'\n#[cfg(test)]\n#[path = "../../audits/reflection_consistency/native.rs"]\nmod reflection_audit;\n')
          subprocess.run(['cargo','fmt','--all'],check=True)
          paths=[Path('Cargo.lock'),Path('Cargo.toml'),Path('AGENTS.md'),Path('audits/reflection_consistency/native.rs')]
          for crate in ['rust_robotics_train','rust_robotics_core','rust_robotics_algo']:
              paths+=list(Path(crate).rglob('*.rs'))+list(Path(crate).rglob('Cargo.toml'))
          for p in paths:
              d=out/'sources'/p;d.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,d)
          shutil.copyfile('.github/workflows/ppo-reflection-consistency.yml',out/'workflow.yml')
          (out/'preparation.patch').write_bytes(subprocess.check_output(['git','diff']))
          (out/'commit.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          (out/'rustc.txt').write_bytes(subprocess.check_output(['rustc','-Vv']))
          PY
      - name: Require actual plant symmetry and ordinary regression controls
        run: |
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$REFLECTION_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee "$REFLECTION_BUILD/native-tests.log"
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics 2>&1 | tee "$REFLECTION_BUILD/integration.log"
          cargo fmt --all -- --check
          git diff --check
          cargo test --locked --release -p rust_robotics_train --lib --no-run --message-format=json > "$REFLECTION_BUILD/build.jsonl"
          python - <<'PY'
          import os,json,shutil
          from pathlib import Path
          out=Path(os.environ['REFLECTION_BUILD']);rows=[json.loads(l) for l in (out/'build.jsonl').read_text().splitlines()]
          bins=[r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('executable') and r['target']['name']=='rust_robotics_train']
          assert len(bins)==1;shutil.copyfile(bins[0],out/'runner')
          PY
          chmod +x "$REFLECTION_BUILD/runner"
          ldd "$REFLECTION_BUILD/runner" > "$REFLECTION_BUILD/linkage.txt"
      - name: Retain failures and restore production sources
        if: always()
        run: |
          git restore -- rust_robotics_train/src/lib.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_algo rust_robotics_core rust_robotics_sim Cargo.lock docs
          python - <<'PY'
          from pathlib import Path
          import os,hashlib,json
          root=Path(os.environ['REFLECTION_BUILD']);root.mkdir(parents=True,exist_ok=True)
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reflection-build
          path: /tmp/reflection-build/
          retention-days: 30
          if-no-files-found: error
  evaluate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [41001, 41002, 41003, 41004, 41005, 41006, 41007, 41008]
    name: Reflection seed ${{ matrix.seed }}
    env:
      REFLECTION_SEED: ${{ matrix.seed }}
      REFLECTION_INPUT: /tmp/reflection-input
      REFLECTION_OUT: /tmp/reflection-${{ matrix.seed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reflection-build
          path: /tmp/reflection-build
      - name: Verify executable and frozen source policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib,subprocess,zipfile,shutil
          build=Path('/tmp/reflection-build');out=Path(os.environ['REFLECTION_OUT']);dest=Path(os.environ['REFLECTION_INPUT'])
          out.mkdir(parents=True,exist_ok=True);dest.mkdir(parents=True,exist_ok=True)
          for n,h in json.loads((build/'manifest.json').read_text()).items(): assert hashlib.sha256((build/n).read_bytes()).hexdigest()==h,n
          for n in ['manifest.json','commit.txt']:shutil.copyfile(build/n,out/('build-'+n))
          ids={41001:(10597053094,'a59922a66b4a9fa09b0b6c9c8105be202525d903949f92300f606a30aa537514'),41002:(10596358808,'df1cb882640246f6bac80053cd125f9501f1ac8c66abeb287c5553f84a92547f'),41003:(10596903929,'3ce5290282b145f95b561399c6c8bbdba47aecc1843d90512f26db8aeaceb980'),41004:(10597238269,'a7422dfeed70f0be7b413bcf524853f3839d8499f49c8f9468e24b707b2db250'),41005:(10597362842,'ee4c718b3402b5788057dba8cb47d0b4d218ca0aa1ddb9a0a6174fc6447456c1'),41006:(10596358543,'28f1ec251c4cc1964db42918870d2cd8b8fb7255d5d73d666092aefe1a995000'),41007:(10597072987,'ce008001876fa2e950408f2dfdbdbbc7b80552a97e2b690f502bc6f8e060be15'),41008:(10596764630,'1c5af0a6a3ec5d1b8ff43890dbb0c108b336ee21f6265e30ac13f0259e73158d')}
          artifact,digest=ids[int(os.environ['REFLECTION_SEED'])];raw=Path('/tmp/reflection-prior.zip')
          with raw.open('wb') as f:subprocess.run(['gh','api',f'repos/yongkyuns/RustRobotics/actions/artifacts/{artifact}/zip'],stdout=f,check=True)
          assert hashlib.sha256(raw.read_bytes()).hexdigest()==digest
          with zipfile.ZipFile(raw) as z:
              m=json.loads(z.read('manifest.json'));assert set(z.namelist())==set(m)|{'manifest.json'}
              for n,h in m.items():assert hashlib.sha256(z.read(n)).hexdigest()==h,n
              (dest/'actor.bin').write_bytes(z.read('global/actor-512.bin'));(dest/'evaluation.csv').write_bytes(z.read('evaluation.csv'))
              (out/'prior-manifest.json').write_bytes(z.read('manifest.json'))
          shutil.copyfile(dest/'evaluation.csv',out/'original-evaluation.csv')
          (out/'source.json').write_text(json.dumps({'artifact_id':artifact,'sha256':digest,'actor_path':'global/actor-512.bin','original_run':35482824488,'source_commit':'a799c6d35c3753266fa382230d734e2d7de18312'},sort_keys=True,indent=2)+'\n')
          PY
          chmod +x /tmp/reflection-build/runner
      - name: Execute all fixed comparisons with no training
        run: |
          /tmp/reflection-build/runner reflection_audit::emit --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$REFLECTION_OUT/execution.log"
          grep -F "REFLECTION DIAGNOSTIC COMPLETE $REFLECTION_SEED" "$REFLECTION_OUT/execution.log"
      - name: Preserve every outcome
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,hashlib,json
          root=Path(os.environ['REFLECTION_OUT']);root.mkdir(parents=True,exist_ok=True)
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reflection-${{ matrix.seed }}
          path: ${{ env.REFLECTION_OUT }}/
          retention-days: 30
          if-no-files-found: error
