name: Probe PPO learning (temporary)
on:
  push:
    branches: [test/ppo-learning-qualification]
    paths: [.github/workflows/probe-ppo-learning.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure exploration cohort only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ppo-learning-probe"
          git rev-parse HEAD > "$RUNNER_TEMP/ppo-learning-probe/revision.txt"
          rustc -Vv > "$RUNNER_TEMP/ppo-learning-probe/rustc.txt"
          sha256sum Cargo.lock > "$RUNNER_TEMP/ppo-learning-probe/lockfile.sha256"
          cargo run --locked --release -p rust_robotics_train --example ppo_learning_probe 2>&1 | tee "$RUNNER_TEMP/ppo-learning-probe/probe.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-learning-probe
          path: ${{ runner.temp }}/ppo-learning-probe/
          retention-days: 30
          if-no-files-found: error
