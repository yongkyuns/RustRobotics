name: Frozen PPO reflection projection

on:
  push:
    branches: ["experiment/ppo-reflection-projection"]
    paths: [".github/workflows/ppo-symmetry-experiment.yml"]

permissions:
  contents: read
  actions: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Retrieve frozen policies without training
        uses: actions/download-artifact@v4
        with:
          repository: yongkyuns/RustRobotics
          run-id: 34240275488
          name: ppo-exploration-ablation
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained-paired-input
      - name: Qualify projection and compare fixed paired episodes
        shell: bash
        run: |
          python3 scripts/run_ppo_symmetry_experiment.py \
            --input "$RUNNER_TEMP/retained-paired-input/ablation/std4" \
            --output "$RUNNER_TEMP/ppo-reflection-evidence"
      - name: Preserve all outcomes, controls and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppo-reflection-evidence
          path: ${{ runner.temp }}/ppo-reflection-evidence/
          if-no-files-found: error
          retention-days: 30
