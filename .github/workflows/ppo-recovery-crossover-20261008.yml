name: PPO contemporaneous recovery actor replay

on:
  push:
    branches: [audit/ppo-historical-crossover-20261008]
    paths:
      - .github/workflows/ppo-recovery-crossover-20261008.yml
      - audits/clean_reference/crossover_20261008/SELECTION.json
      - audits/clean_reference/crossover_20261008/replay.py

permissions:
  contents: read
  actions: read

jobs:
  historical-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile replay source and preserve provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/provenance
          python3 -m py_compile audits/clean_reference/crossover_20261008/replay.py
          git rev-parse HEAD > evidence/provenance/commit.txt
          lscpu > evidence/provenance/lscpu.txt
          cp audits/clean_reference/crossover_20261008/SELECTION.json evidence/provenance/SELECTION.json
          sha256sum audits/clean_reference/crossover_20261008/replay.py audits/clean_reference/crossover_20261008/SELECTION.json audits/clean_reference/value_batch_compare_20261007.py > evidence/provenance/source-sha256.txt
      - name: Recover pinned runtime and source data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pinned runtime inputs/seed201
          gh api repos/${{ github.repository }}/actions/artifacts/11441687522/zip > runtime.zip
          echo '7418edd50c11ae67ef761610a15c4a0c6ee70f2d3fa032609d6394eb745b5dd1  runtime.zip' | sha256sum -c -
          unzip -q runtime.zip -d pinned
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('pinned')
          manifest=json.loads((root/'manifest.json').read_text())
          for name,digest in manifest.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          print('Pinned runtime payloads:',len(manifest))
          PY
          tar -xzf pinned/python311.tar.gz -C runtime
          runtime/python/bin/python3.11 -m pip install --no-index --find-links pinned/wheels 'numpy==2.2.6' 'torch==2.8.0+cpu' 'stable-baselines3==2.9.0' 'gymnasium==1.3.0'
          gh api repos/${{ github.repository }}/actions/artifacts/11441435840/zip > pair201.zip
          echo '22ea3b48e60b8199131fd5379e859017cc7b5212d58bbb5c06cb5b52166ce86c  pair201.zip' | sha256sum -c -
          unzip -p pair201.zip native.zip > inputs/native.zip
          echo '58af5206058b24a8cd39c2665d9bc187200a4e8acaf3841a367d27731e09cdc0  inputs/native.zip' | sha256sum -c -
          gh api repos/${{ github.repository }}/actions/artifacts/11504926318/zip > seed201.zip
          echo '11d9efaeb4225ef70449f7672bc72accc0a0001bffcf3d2f31a814ba25c2b4a2  seed201.zip' | sha256sum -c -
          unzip -q seed201.zip -d inputs/seed201
          test -f inputs/seed201/control/policy-1048576.npz
          sha256sum runtime.zip pair201.zip seed201.zip inputs/native.zip >> evidence/provenance/source-sha256.txt
      - name: Recorder noninterference preflight
        shell: bash
        run: |
          set -euo pipefail
          runtime/python/bin/python3.11 audits/clean_reference/crossover_20261008/replay.py preflight --raw inputs/native.zip --control inputs/seed201/control --out evidence/preflight 2>&1 | tee evidence/preflight.log
      - name: Reconstruct all 512 updates and 32 incoming actors
        shell: bash
        run: |
          set -euo pipefail
          runtime/python/bin/python3.11 audits/clean_reference/crossover_20261008/replay.py replay --raw inputs/native.zip --control inputs/seed201/control --out evidence/recovered 2>&1 | tee evidence/replay.log
          test -f evidence/recovered/COMPLETE.json
      - name: Preserve artifact manifest even after failure
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('evidence')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p!=root/'MANIFEST.json'}
          (root/'MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ppo-recovery-actor-replay-${{ github.run_id }}
          path: evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
