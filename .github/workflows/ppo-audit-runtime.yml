name: Pinned offline PPO audit runtime
on:
  push:
    branches: [audit/ppo-clean-reference-20260925]
    paths: [.github/workflows/ppo-audit-runtime.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned portable runtime and direct dependency wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ppo-runtime/wheels
          curl --fail --location --retry 2 'https://github.com/astral-sh/python-build-standalone/releases/download/20260203/cpython-3.11.14%2B20260203-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz' -o /tmp/ppo-runtime/python311.tar.gz
          python -m pip download --dest /tmp/ppo-runtime/wheels torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip download --dest /tmp/ppo-runtime/wheels --no-deps numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0 scipy==1.16.2 cloudpickle==3.1.1 farama-notifications==0.0.4 pandas==2.3.3 matplotlib==3.10.7 contourpy==1.3.3 cycler==0.12.1 fonttools==4.60.1 kiwisolver==1.4.9 packaging==25.0 pillow==11.3.0 pyparsing==3.2.5 python-dateutil==2.9.0.post0 pytz==2025.2 tzdata==2025.2 six==1.17.0
          lscpu > /tmp/ppo-runtime/lscpu.txt
          python --version > /tmp/ppo-runtime/packaging-python.txt
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('/tmp/ppo-runtime')
          (p/'manifest.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file()},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-pinned-runtime-20261006
          path: /tmp/ppo-runtime/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
