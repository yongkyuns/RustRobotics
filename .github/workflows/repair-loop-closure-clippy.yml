name: Repair loop closure Clippy

on:
  push:
    branches: ["fix/loop-closure-hardening-current"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/loop-closure-hardening-current
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply explicit strict-Clippy fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rust_robotics_algo/src/slam/loop_closure.rs")
          source = path.read_text()

          replacements = [
              (
                  """        for candidate_idx in 0..=max_candidate_idx.min(poses.len().saturating_sub(1)) {\n            let candidate_pose = &poses[candidate_idx];\n""",
                  """        let candidate_count = max_candidate_idx.min(poses.len().saturating_sub(1)) + 1;\n        for (candidate_idx, candidate_pose) in poses.iter().enumerate().take(candidate_count) {\n""",
              ),
              (
                  """        let mut config = LoopClosureConfig::default();\n        config.proximity_threshold = 1.0;\n        config.min_temporal_separation = 3;\n        config.landmark_observation_gap = 3;\n        config.min_common_landmarks = 3;\n""",
                  """        let config = LoopClosureConfig {\n            proximity_threshold: 1.0,\n            min_temporal_separation: 3,\n            landmark_observation_gap: 3,\n            min_common_landmarks: 3,\n            ..Default::default()\n        };\n""",
              ),
              (
                  """        let mut config = LoopClosureConfig::default();\n        config.proximity_threshold = 0.1;\n        config.min_temporal_separation = 3;\n        config.landmark_observation_gap = 3;\n        config.min_common_landmarks = 3;\n""",
                  """        let config = LoopClosureConfig {\n            proximity_threshold: 0.1,\n            min_temporal_separation: 3,\n            landmark_observation_gap: 3,\n            min_common_landmarks: 3,\n            ..Default::default()\n        };\n""",
              ),
              (
                  """        let mut config = LoopClosureConfig::default();\n        config.proximity_threshold = 0.1;\n        config.landmark_observation_gap = 3;\n        config.min_common_landmarks = 3;\n""",
                  """        let config = LoopClosureConfig {\n            proximity_threshold: 0.1,\n            landmark_observation_gap: 3,\n            min_common_landmarks: 3,\n            ..Default::default()\n        };\n""",
              ),
              (
                  """        let mut config = LoopClosureConfig::default();\n        config.proximity_threshold = 20.0;\n        config.min_temporal_separation = 3;\n        config.landmark_observation_gap = 3;\n        config.min_common_landmarks = 3;\n""",
                  """        let config = LoopClosureConfig {\n            proximity_threshold: 20.0,\n            min_temporal_separation: 3,\n            landmark_observation_gap: 3,\n            min_common_landmarks: 3,\n            ..Default::default()\n        };\n""",
              ),
              (
                  """        let mut config = LoopClosureConfig::default();\n        config.chi2_confidence = 0.99;\n""",
                  """        let config = LoopClosureConfig {\n            chi2_confidence: 0.99,\n            ..Default::default()\n        };\n""",
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"expected source block not found: {old!r}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          cargo fmt --all
          cargo clippy -p rust_robotics_algo --all-targets -- -D warnings
          cargo test -p rust_robotics_algo slam::loop_closure
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust_robotics_algo/src/slam/loop_closure.rs
          git commit -m "Address strict Clippy in loop closure hardening"
          git push origin HEAD:fix/loop-closure-hardening-current
