name: Repair loop closure Clippy

on:
  push:
    branches: ["fix/loop-closure-hardening-current"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/loop-closure-hardening-current
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply strict Clippy fixes
        run: |
          cargo clippy -p rust_robotics_algo --all-targets --fix --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          cargo test -p rust_robotics_algo
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust_robotics_algo/src/slam/loop_closure.rs
          git commit -m "Address strict Clippy in loop closure hardening"
          git push origin HEAD:fix/loop-closure-hardening-current
