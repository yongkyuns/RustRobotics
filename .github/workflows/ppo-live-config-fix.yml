name: PPO live trainer config fix

on:
  push:
    branches: ["fix/ppo-live-trainer-config-invalidation"]
    paths:
      - "rust_robotics_sim/src/simulator/pendulum/domain.rs"
      - "rust_robotics_sim/src/simulator/pendulum/training.rs"
      - ".github/workflows/ppo-live-config-fix.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      MUJOCO_VERSION: 3.4.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Install MuJoCo
        run: |
          curl -L --fail \
            -o "$RUNNER_TEMP/mujoco.tar.gz" \
            "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"
          tar -xzf "$RUNNER_TEMP/mujoco.tar.gz" -C "$RUNNER_TEMP"
          echo "MUJOCO_HOME=$RUNNER_TEMP/mujoco-${MUJOCO_VERSION}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mujoco-${MUJOCO_VERSION}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Strict formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p rust_robotics_sim --all-targets -- -D warnings
      - name: Pendulum and trainer integration tests
        run: |
          cargo test --locked --release -p rust_robotics_sim simulator::pendulum -- --test-threads=1
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics
