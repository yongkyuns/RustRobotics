name: Dependency audit

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Verify lockfile is current
        run: |
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Audit Rust dependencies
        run: cargo audit

  npm:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked npm dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts --no-audit
      - name: Verify npm manifests are unchanged
        run: git diff --exit-code -- package.json package-lock.json
      # Policy and scope: BROWSER_TOOLING_SECURITY.md. Do not omit dev dependencies.
      - name: Audit npm dependencies including browser tooling
        shell: bash
        run: npm --silent run audit:npm -- --json | tee npm-audit.json
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

  docs-javascript:
    name: Tutorial JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tutorial embed JavaScript
        run: node --check site_docs/_static/sim_embed.js
