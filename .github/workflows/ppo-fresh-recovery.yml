name: PPO fresh-cohort from-scratch qualification

on:
  push:
    branches: ["audit/ppo-fresh-recovery-20260919"]
    paths: [".github/workflows/ppo-fresh-recovery.yml", "audits/fresh_recovery/native.rs", "audits/fresh_recovery/prepare.py"]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      HORIZON_BUILD: /tmp/fresh-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Bind exact prior recipe and require random-start and isolation controls
        run: |
          mkdir -p "$HORIZON_BUILD"
          python audits/fresh_recovery/prepare.py 2>&1 | tee "$HORIZON_BUILD/preparation.log"
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$HORIZON_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee "$HORIZON_BUILD/tests.log"
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics 2>&1 | tee "$HORIZON_BUILD/integration.log"
          cargo fmt --all -- --check
          git diff --check
      - name: Export the actual tested native endpoint
        run: |
          cargo test --locked --release -p rust_robotics_train --lib --no-run --message-format=json > "$HORIZON_BUILD/build.jsonl"
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ['HORIZON_BUILD'])
          rows=[json.loads(l) for l in (root/'build.jsonl').read_text().splitlines()]
          binaries=[r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('executable') and r['target']['name']=='rust_robotics_train']
          assert len(binaries)==1,binaries
          shutil.copyfile(binaries[0],root/'runner')
          PY
          chmod +x "$HORIZON_BUILD/runner"
          ldd "$HORIZON_BUILD/runner" > "$HORIZON_BUILD/linkage.txt"
      - name: Preserve all outcomes and restore protected source
        if: always()
        run: |
          mkdir -p "$HORIZON_BUILD"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['HORIZON_BUILD'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2)+'\n')
          PY
          git restore -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/ppo_rollout_pool.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_algo rust_robotics_core rust_robotics_sim Cargo.lock docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-recovery-build
          path: /tmp/fresh-build/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  measure:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        seed: [41001, 41002, 41003, 41004, 41005, 41006, 41007, 41008]
        arm: [baseline95, ordinary, near-union, recovery-union]
    name: Fresh ${{ matrix.arm }} seed ${{ matrix.seed }}
    env:
      HORIZON_SEED: ${{ matrix.seed }}
      FRESH_ARM: ${{ matrix.arm }}
      HORIZON_BUILD: /tmp/fresh-build
      HORIZON_OUT: /tmp/fresh-result
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fresh-recovery-build
          path: /tmp/fresh-build
      - name: Verify the tested executable without importing any historical policy
        run: |
          mkdir -p "$HORIZON_OUT"
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          build=Path(os.environ['HORIZON_BUILD']);out=Path(os.environ['HORIZON_OUT'])
          for n,h in json.loads((build/'manifest.json').read_text()).items(): assert hashlib.sha256((build/n).read_bytes()).hexdigest()==h,n
          for n in ['manifest.json','commit.txt','baseline.txt']:
              shutil.copyfile(build/n,out/('build-'+n))
          assert 'HORIZON_PRIOR' not in os.environ
          PY
          chmod +x "$HORIZON_BUILD/runner"
      - name: Run random initialization through the fixed final checkpoint
        run: |
          "$HORIZON_BUILD/runner" trainer::horizon_audit::tail_support::recovery_anchor::recovery_rewards::repeated_recovery::fresh_recovery::emit_fresh_recovery --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$HORIZON_OUT/execution.log"
          grep -F "FRESH RECOVERY COMPLETE $FRESH_ARM $HORIZON_SEED" "$HORIZON_OUT/execution.log"
      - name: Retain every checkpoint and any failure
        if: always()
        run: |
          mkdir -p "$HORIZON_OUT"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['HORIZON_OUT'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-recovery-${{ matrix.arm }}-${{ matrix.seed }}
          path: /tmp/fresh-result/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
