name: Experimental native PPO seed 201 cohort

on:
  push:
    branches: ["experiment/ppo-cleanrl-native-reference"]
    paths:
      - ".github/workflows/cleanrl-native-cohort-seed201.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ppo-cohort-seed201-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed-201:
    name: First full-budget native PPO seed 201
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-ppo-cleanrl-experiment-v1
      - name: Record pinned source and toolchain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-cohort"
          {
            printf 'source_sha='
            git rev-parse HEAD
            rustc --version
            cargo --version
            printf 'seed=201\n'
            printf 'requested_updates=976\n'
            printf 'physical_steps_per_update=512\n'
            printf 'total_train_steps=499712\n'
            printf 'evaluation_horizon_ticks=1500\n'
          } > "$RUNNER_TEMP/native-cohort/provenance.txt"
      - name: Validate native source before expensive learning
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p rust_robotics_train --features cleanrl-reference --lib cleanrl_reference:: -- --nocapture
          cargo clippy --locked -p rust_robotics_train --features cleanrl-reference --lib --tests --examples -- -D warnings
      - name: Full 976-update experiment on seed 201
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p rust_robotics_train --features cleanrl-reference \
            --example cleanrl_reference_cohort -- \
            201 "$RUNNER_TEMP/native-cohort/seed-201.csv" \
            2>&1 | tee "$RUNNER_TEMP/native-cohort/seed-201.log"
          printf 'seed_complete=yes\n' >> "$RUNNER_TEMP/native-cohort/provenance.txt"
      - name: Verify complete checkpoint and panel rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, os, pathlib, collections
          folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-cohort"
          path = folder / "seed-201.csv"
          rows = list(csv.DictReader(path.open()))
          expect = {(update, panel, mode) for update in ("0", "64", "128", "256", "512", "768", "976") for panel in ("ordinary", "difficult") for mode in ("deterministic", "stochastic")}
          groups = collections.Counter((r["updates"],r["panel"],r["mode"]) for r in rows)
          assert set(groups) == expect, (len(groups),expect - set(groups))
          assert all(count == 64 for count in groups.values()), groups
          assert len(rows) == 7 * 2 * 2 * 64, len(rows)
          assert all(int(r["seed"]) == 201 for r in rows)
          assert all(r["completed"] in ("true","false") for r in rows)
          final = [r for r in rows if r["updates"] == "976"]
          summary = []
          for panel in ("ordinary", "difficult"):
              for mode in ("deterministic","stochastic"):
                  subset = [r for r in final if r["panel"] == panel and r["mode"] == mode]
                  completed = sum(r["completed"] == "true" for r in subset)
                  summary.append(f"{panel} {mode}: {completed}/64")
          (folder / "summary.txt").write_text("\n".join(summary) + "\n")
          print("\n".join(summary))
          PY
          sha256sum "$RUNNER_TEMP/native-cohort/seed-201.csv" >> "$RUNNER_TEMP/native-cohort/provenance.txt"
      - name: Preserve all evidence, including failures and partial data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ppo-cleanrl-seed201-evidence
          path: ${{ runner.temp }}/native-cohort/
          retention-days: 14
          if-no-files-found: warn
