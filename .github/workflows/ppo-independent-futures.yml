name: PPO frozen independent-future variance
on:
  push:
    branches: ["audit/ppo-independent-futures-20260921"]
    paths:
      - ".github/workflows/ppo-independent-futures.yml"
      - "audits/independent_futures/**"
concurrency:
  group: ppo-independent-futures-20260921
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      FUTURE_BUILD: /tmp/future-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Attach observation-only boundary hooks
        run: |
          mkdir -p "$FUTURE_BUILD"
          python audits/independent_futures/prepare.py 2>&1 | tee "$FUTURE_BUILD/preparation.log"
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$FUTURE_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee "$FUTURE_BUILD/tests.log"
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics 2>&1 | tee "$FUTURE_BUILD/integration.log"
          cargo fmt --all -- --check
          git diff --check
      - name: Export exact tested endpoint
        run: |
          cargo test --locked --release -p rust_robotics_train --lib --no-run --message-format=json > "$FUTURE_BUILD/build.jsonl"
          python - <<'PY'
          import json,os,shutil,subprocess
          from pathlib import Path
          out=Path(os.environ["FUTURE_BUILD"])
          rows=[json.loads(line) for line in (out/"build.jsonl").read_text().splitlines()]
          bins=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("executable") and r["target"]["name"]=="rust_robotics_train"]
          assert len(bins)==1,bins
          shutil.copyfile(bins[0],out/"runner");(out/"runner").chmod(0o755)
          tests=subprocess.check_output([str(out/"runner"),"--list"]).decode().splitlines()
          endpoints=[line.removesuffix(": test") for line in tests if line.endswith("::emit_independent_futures: test")]
          assert len(endpoints)==1,endpoints
          (out/"endpoint.txt").write_text(endpoints[0]+"\n")
          PY
          ldd "$FUTURE_BUILD/runner" > "$FUTURE_BUILD/linkage.txt"
      - name: Preserve build evidence and restore protected source
        if: always()
        run: |
          git restore -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/ppo_rollout_pool.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_algo rust_robotics_core rust_robotics_sim Cargo.lock docs
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["FUTURE_BUILD"]);root.mkdir(parents=True,exist_ok=True)
          (root/"manifest.json").write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob("*")) if p.is_file() and p.name!="manifest.json"},sort_keys=True,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-futures-build
          path: /tmp/future-build/
          retention-days: 30
          if-no-files-found: error

  measure:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUTURE_BUILD: /tmp/future-build
      FUTURE_INPUT: /tmp/future-input
      FUTURE_OUT: /tmp/future-out
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: independent-futures-build
          path: /tmp/future-build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable incoming policy and paired-credit reference
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          mkdir -p "$FUTURE_INPUT" "$FUTURE_OUT"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,zipfile,shutil
          build=Path(os.environ["FUTURE_BUILD"])
          for name,digest in json.loads((build/"manifest.json").read_text()).items():
              assert hashlib.sha256((build/name).read_bytes()).hexdigest()==digest,name

          raw=Path("/tmp/regression-window-41006.zip")
          with raw.open("wb") as f:
              subprocess.run(["gh","api","repos/yongkyuns/RustRobotics/actions/artifacts/10620305749/zip"],stdout=f,check=True)
          assert hashlib.sha256(raw.read_bytes()).hexdigest()=="c6ed988a1d4a293b11c5037a8c9886afb31ab83c5b45cb2549427d559b462b96"
          with zipfile.ZipFile(raw) as z:
              manifest=json.loads(z.read("manifest.json"))
              assert set(z.namelist())==set(manifest)|{"manifest.json"}
              for name,digest in manifest.items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==digest,name
              for name in ["actor-4139.bin","critic-4139.bin"]:
                  Path(os.environ["FUTURE_INPUT"],name).write_bytes(z.read(name))

          paired=Path("/tmp/paired-credit-41006.zip")
          with paired.open("wb") as f:
              subprocess.run(["gh","api","repos/yongkyuns/RustRobotics/actions/artifacts/10638379259/zip"],stdout=f,check=True)
          assert hashlib.sha256(paired.read_bytes()).hexdigest()=="65e071b04fa23f550a8be4cc306c05ccfe7d76eec0dfc6e7e1bab21cb3698ece"
          with zipfile.ZipFile(paired) as z:
              manifest=json.loads(z.read("manifest.json"))
              assert set(z.namelist())==set(manifest)|{"manifest.json"}
              for name,digest in manifest.items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==digest,name
          shutil.copyfile(paired,Path(os.environ["FUTURE_OUT"])/"paired-credit-41006.zip")
          shutil.copyfile(Path(os.environ["FUTURE_INPUT"])/"actor-4139.bin",Path(os.environ["FUTURE_OUT"])/"actor-4139.bin")
          (Path(os.environ["FUTURE_OUT"])/"sources.json").write_text(json.dumps({
              "incoming_artifact":10620305749,
              "incoming_sha256":"c6ed988a1d4a293b11c5037a8c9886afb31ab83c5b45cb2549427d559b462b96",
              "paired_artifact":10638379259,
              "paired_sha256":"65e071b04fa23f550a8be4cc306c05ccfe7d76eec0dfc6e7e1bab21cb3698ece",
              "incoming_checkpoint":4139,
              "training_updates":0
          },sort_keys=True,indent=2)+"\n")
          PY
      - name: Collect fixed-policy independent futures
        run: |
          endpoint=$(cat "$FUTURE_BUILD/endpoint.txt")
          "$FUTURE_BUILD/runner" "$endpoint" --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$FUTURE_OUT/execution.log"
          grep -F "INDEPENDENT FUTURES COMPLETE" "$FUTURE_OUT/execution.log"
      - name: Independent NumPy gradient analysis
        run: |
          python -m pip install --disable-pip-version-check --quiet "numpy==2.2.6"
          python audits/independent_futures/analyze.py \
            "$FUTURE_OUT/selected.csv" \
            "$FUTURE_OUT/actor-4139.bin" \
            "$FUTURE_OUT/paired-credit-41006.zip" \
            "$FUTURE_OUT/analysis" 2>&1 | tee "$FUTURE_OUT/analysis.log"
      - name: Preserve every result
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["FUTURE_OUT"]);root.mkdir(parents=True,exist_ok=True)
          (root/"manifest.json").write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob("*")) if p.is_file() and p.name!="manifest.json"},sort_keys=True,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-futures-result
          path: /tmp/future-out/
          retention-days: 30
          if-no-files-found: error
