name: PPO confirmation runtime recovery (no training)
on:
  push:
    branches: [audit/ppo-update410-confirmation-20261014]
    paths: [.github/workflows/ppo-confirmation-runtime-20261014.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch original portable Python and pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence runtime
          curl --fail --location --retry 2 'https://github.com/astral-sh/python-build-standalone/releases/download/20260203/cpython-3.11.14%2B20260203-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz' -o evidence/python311.tar.gz
          sha256sum evidence/python311.tar.gz > evidence/interpreter.sha256
          tar -xzf evidence/python311.tar.gz -C runtime
          P="$PWD/runtime/python/bin/python3.11"
          "$P" -m pip install 'torch==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee evidence/torch-install.log
          "$P" -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0 scipy==1.16.2 cloudpickle==3.1.1 farama-notifications==0.0.4 pandas==2.3.3 matplotlib==3.10.7 contourpy==1.3.3 cycler==0.12.1 fonttools==4.60.1 kiwisolver==1.4.9 packaging==25.0 pillow==11.3.0 pyparsing==3.2.5 python-dateutil==2.9.0.post0 pytz==2025.2 tzdata==2025.2 six==1.17.0 2>&1 | tee evidence/reference-install.log
          "$P" -m pip freeze > evidence/freeze.txt
          "$P" - <<'PY'
          import sys,json,hashlib,pathlib,inspect,torch,numpy,gymnasium,stable_baselines3
          import stable_baselines3.ppo.ppo as ppo
          import stable_baselines3.common.buffers as buffers
          import stable_baselines3.common.policies as policies
          import stable_baselines3.common.on_policy_algorithm as on_policy_algorithm
          assert sys.version_info[:3]==(3,11,14)
          assert torch.__version__=='2.8.0+cpu' and numpy.__version__=='2.2.6'
          assert gymnasium.__version__=='1.3.0' and stable_baselines3.__version__=='2.9.0'
          root=pathlib.Path('evidence'); (root/'sb3-source').mkdir()
          for mod in [ppo,buffers,policies,on_policy_algorithm]:
              (root/'sb3-source'/pathlib.Path(mod.__file__).name).write_text(inspect.getsource(mod))
          (root/'runtime.json').write_text(json.dumps(dict(python=sys.version,torch=torch.__version__,numpy=numpy.__version__,gymnasium=gymnasium.__version__,sb3=stable_baselines3.__version__),indent=2)+'\n')
          PY
          lscpu > evidence/lscpu.txt
          tar -czf evidence/python311-installed.tar.gz -C runtime python
          rm evidence/python311.tar.gz
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('evidence')
          (root/'MANIFEST.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ppo-confirmation-runtime-20261014
          path: evidence/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
