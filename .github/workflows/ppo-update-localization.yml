name: PPO update localization (diagnostic only)
on:
  push:
    branches: [audit/ppo-clean-reference-20260925]
    paths: [.github/workflows/ppo-update-localization.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ppo-update-localization-20261006
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve source and machine receipts
        run: |
          mkdir -p /tmp/ppo-update-localization/raw
          git rev-parse HEAD > /tmp/ppo-update-localization/executed-commit.txt
          cp audits/clean_reference/update_audit_20261006.py audits/clean_reference/local_linearization.py .github/workflows/ppo-update-localization.yml /tmp/ppo-update-localization/
          lscpu > /tmp/ppo-update-localization/lscpu.txt
          uname -a > /tmp/ppo-update-localization/uname.txt
      - name: Install the original direct numeric dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee /tmp/ppo-update-localization/install-torch.log
          python -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0 2>&1 | tee /tmp/ppo-update-localization/install-reference.log
          python -m pip freeze > /tmp/ppo-update-localization/python-freeze.txt
      - name: Recover original immutable native and stock-seed archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for item in '10860907319 clean-ppo-native' '10861594419 clean-ppo-sb3-defaults-203'; do
            read -r id name <<< "$item"
            curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "/tmp/ppo-update-localization/raw/${name}.zip"
          done
      - name: Check diagnostic controls before collecting training data
        run: |
          python -m py_compile audits/clean_reference/update_audit_20261006.py
          PYTHONPATH=audits/clean_reference python - <<'PY' 2>&1 | tee /tmp/ppo-update-localization/preflight.log
          import pathlib,copy,numpy as np,torch
          import update_audit_20261006 as a
          p=pathlib.Path('/tmp/ppo-update-localization')
          a.unpack(p/'raw',p/'inputs')
          ref=a.load_reference(p/'inputs')
          r=lambda x:dict(nearest=None if x is None else dict(radius=x))
          assert a.crossing(r(.99),r(1.01))
          assert not a.crossing(r(1.01),r(.99))
          assert not a.crossing(r(None),r(1.01))
          assert not a.crossing(r(.99999999),r(1.00000001))
          v={'x':torch.tensor([1.]),'y':np.array([2.])}
          assert a.eq(v,copy.deepcopy(v))
          changed=copy.deepcopy(v);changed['x'][0]+=1
          assert not a.eq(v,changed)
          for cp in (65536,262144):
              with np.load(p/'inputs/clean-ppo-sb3-defaults-203'/f'policy-{cp}.npz',allow_pickle=False) as z:
                  state={k:torch.from_numpy(z[k].copy()) for k in z.files}
              before=a.rng();report=a.finite_difference(state)
              assert a.eq(before,a.rng())
              print('SAVED ACTOR CONTROL',cp,report)
          print('DIAGNOSTIC PREFLIGHT PASS')
          PY
      - name: Execute paired original prefixes and exact frozen-update controls
        run: |
          python audits/clean_reference/update_audit_20261006.py --raw /tmp/ppo-update-localization/raw --output /tmp/ppo-update-localization 2>&1 | tee /tmp/ppo-update-localization/audit.log
          grep -F 'COMPLETE UPDATE AUDIT' /tmp/ppo-update-localization/audit.log
      - name: Retain every outcome including failed qualification
        if: always()
        run: |
          git diff --exit-code
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('/tmp/ppo-update-localization')
          p.mkdir(parents=True,exist_ok=True)
          (p/'manifest.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and f!=p/'manifest.json'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-update-localization-20261006
          path: /tmp/ppo-update-localization/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
