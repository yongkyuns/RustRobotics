name: PPO fixed-tensor replay

on:
  push:
    branches: ["audit/ppo-fixed-tensor-20260918"]
    paths: [".github/workflows/ppo-fixed-tensor.yml", "audits/ppo_boundary/fixed_tensors.py"]

permissions:
  contents: read
  actions: read

concurrency:
  group: ppo-fixed-tensor-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/ppo-fixed-tensor.yml
      - name: Recover and verify immutable native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ppo-fixed/evidence /tmp/ppo-fixed/results
          gh api repos/yongkyuns/RustRobotics/actions/artifacts/10560032269/zip > /tmp/ppo-fixed/native-archive.zip
          echo '8e6948cf6cd032ea8777096e92010f5e592507df6ab414bb19b713df00e3465e  /tmp/ppo-fixed/native-archive.zip' | sha256sum --check
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('/tmp/ppo-fixed/evidence')
          with zipfile.ZipFile('/tmp/ppo-fixed/native-archive.zip') as z:
              assert all(not p.startswith('/') and '..' not in Path(p).parts for p in z.namelist())
              z.extractall(root)
          manifest=json.loads((root/'manifest.json').read_text())
          for name,digest in manifest.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          print('Verified archive and',len(manifest),'member hashes')
          PY
      - name: Install pinned real reference
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0
          python -m pip freeze > /tmp/ppo-fixed/python-freeze.txt
      - name: Execute exact-tensor comparison without relaxing thresholds
        run: |
          python -m py_compile audits/ppo_boundary/fixed_tensors.py
          cp audits/ppo_boundary/fixed_tensors.py /tmp/ppo-fixed/
          git rev-parse HEAD > /tmp/ppo-fixed/executed-commit.txt
          python audits/ppo_boundary/fixed_tensors.py --native /tmp/ppo-fixed/evidence/native --output /tmp/ppo-fixed/results 2>&1 | tee /tmp/ppo-fixed/execution.log
      - name: Preserve all outcomes
        if: always()
        run: |
          mkdir -p /tmp/ppo-fixed
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/ppo-fixed')
          # Retain the unchanged original archive, not a duplicate extracted tree.
          import shutil
          if (root/'evidence').exists(): shutil.rmtree(root/'evidence')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-fixed-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ppo-fixed/
          if-no-files-found: error
          retention-days: 30

  lock-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: taiki-e/install-action@cargo-audit
      - name: Resolve only the documented rustls security update
        run: |
          mkdir -p /tmp/ppo-lock-review
          cp Cargo.lock /tmp/ppo-lock-review/before.lock
          cargo update -p rustls --precise 0.23.45
          cargo metadata --locked --format-version 1 > /tmp/ppo-lock-review/metadata.json
          cp Cargo.lock /tmp/ppo-lock-review/Cargo.lock
          git diff -- Cargo.lock > /tmp/ppo-lock-review/lock.patch
          python - <<'PY'
          import tomllib,json,hashlib
          from pathlib import Path
          root=Path('/tmp/ppo-lock-review')
          before=tomllib.loads((root/'before.lock').read_text())
          after=tomllib.loads((root/'Cargo.lock').read_text())
          old=[p for p in before['package'] if p['name']=='rustls']
          new=[p for p in after['package'] if p['name']=='rustls']
          assert len(old)==len(new)==1 and old[0]['version']=='0.23.44' and new[0]['version']=='0.23.45'
          assert [p for p in before['package'] if p['name']!='rustls']==[p for p in after['package'] if p['name']!='rustls'],'unexpected dependency changes'
          assert old[0]['dependencies']==new[0]['dependencies'],'unexpected rustls dependency graph change'
          summary={'old':old[0],'new':new[0],'sha256':hashlib.sha256((root/'Cargo.lock').read_bytes()).hexdigest(),'only_rustls_changed':True}
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY
          cargo audit --json > /tmp/ppo-lock-review/audit.json
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-lock-review-${{ github.run_id }}
          path: /tmp/ppo-lock-review/
          if-no-files-found: error
          retention-days: 30
