name: PPO actual-rollout horizon attribution

on:
  push:
    branches: ["audit/ppo-rollout-horizon-20260918"]
    paths: [".github/workflows/ppo-rollout-horizon.yml", "audits/rollout_horizon/native.rs", "audits/rollout_horizon/prepare.py"]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      HORIZON_BUILD: /tmp/horizon-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Prepare observer-only source and require native controls
        run: |
          mkdir -p "$HORIZON_BUILD"
          python audits/rollout_horizon/prepare.py 2>&1 | tee "$HORIZON_BUILD/preparation.log"
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$HORIZON_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee "$HORIZON_BUILD/tests.log"
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics 2>&1 | tee "$HORIZON_BUILD/integration.log"
          cargo fmt --all -- --check
          git diff --check
      - name: Export the actual compiled test endpoint
        run: |
          cargo test --locked --release -p rust_robotics_train --lib --no-run --message-format=json > "$HORIZON_BUILD/build.jsonl"
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          out=Path(os.environ['HORIZON_BUILD'])
          rows=[json.loads(l) for l in (out/'build.jsonl').read_text().splitlines()]
          candidates=[r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('executable') and r['target']['name']=='rust_robotics_train']
          assert len(candidates)==1,candidates
          shutil.copyfile(candidates[0],out/'runner')
          PY
          chmod +x "$HORIZON_BUILD/runner"
          ldd "$HORIZON_BUILD/runner" > "$HORIZON_BUILD/linkage.txt"
      - name: Retain exact sources and restore protected files
        if: always()
        run: |
          mkdir -p "$HORIZON_BUILD"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['HORIZON_BUILD'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2)+'\n')
          PY
          git restore -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/ppo_rollout_pool.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_algo rust_robotics_core rust_robotics_sim Cargo.lock docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-horizon-build
          path: /tmp/horizon-build/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  diagnose:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [201, 202, 203, 204]
    name: Actual rollout seed ${{ matrix.seed }}
    env:
      HORIZON_SEED: ${{ matrix.seed }}
      HORIZON_BUILD: /tmp/horizon-build
      HORIZON_OUT: /tmp/horizon-${{ matrix.seed }}
      HORIZON_PRIOR: /tmp/horizon-prior
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rollout-horizon-build
          path: /tmp/horizon-build
      - name: Verify the executable and immutable lambda-one checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HORIZON_OUT" "$HORIZON_PRIOR"
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path
          build=Path(os.environ['HORIZON_BUILD']);out=Path(os.environ['HORIZON_OUT']);prior=Path(os.environ['HORIZON_PRIOR'])
          for n,h in json.loads((build/'manifest.json').read_text()).items(): assert hashlib.sha256((build/n).read_bytes()).hexdigest()==h,n
          for n in ['manifest.json','commit.txt','baseline.txt']: shutil.copyfile(build/n,out/('build-'+n))
          ids={201:(10577110403,'d35398a02a58e61cfd70c1ef8be3a3b35fe01802c4f8d612f6be6c525d8d5591'),202:(10576344027,'8f0a9092f9ed92c5f4a560d260ea95aed3fd6470a33ae013718e629bea4f325a'),203:(10576029476,'45aa3b6165d1e885468e8451bfe46de83554cae9737f9ae2cdda63c519358dfa'),204:(10577110380,'b491ec82d561a63d555f2c1b68bbb391d5ba389ec920c15272c182dad0dfb4c9')}
          artifact,digest=ids[int(os.environ['HORIZON_SEED'])]
          path=out/'prior-lambda-one.zip'
          with path.open('wb') as f: subprocess.run(['gh','api',f'repos/yongkyuns/RustRobotics/actions/artifacts/{artifact}/zip'],stdout=f,check=True)
          assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          with zipfile.ZipFile(path) as z:
              for n,h in json.loads(z.read('manifest.json')).items(): assert hashlib.sha256(z.read(n)).hexdigest()==h,n
              for n in ['actor-4194304.bin','critic-4194304.bin']: (prior/n).write_bytes(z.read(n))
          (out/'prior-source.json').write_text(json.dumps({'artifact':artifact,'sha256':digest})+'\n')
          PY
          chmod +x "$HORIZON_BUILD/runner"
      - name: Replay the actual last update and all prescribed continuations
        run: |
          "$HORIZON_BUILD/runner" trainer::horizon_audit::emit --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$HORIZON_OUT/execution.log"
          grep -F "ROLLOUT HORIZON COMPLETE $HORIZON_SEED" "$HORIZON_OUT/execution.log"
      - name: Preserve every result and failure
        if: always()
        run: |
          mkdir -p "$HORIZON_OUT"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['HORIZON_OUT'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-horizon-${{ matrix.seed }}
          path: ${{ env.HORIZON_OUT }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
