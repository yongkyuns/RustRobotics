name: PPO boundary replay

on:
  push:
    branches: ["audit/ppo-boundary-parity-20260918"]
    paths: [".github/workflows/ppo-boundary.yml", "audits/ppo_boundary/**"]

permissions:
  contents: read

concurrency:
  group: ppo-boundary-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      PPO_BOUNDARY_OUT: /tmp/ppo-boundary/native
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/ppo-boundary.yml
      - name: Prepare observer-only native probe
        run: |
          mkdir -p "$PPO_BOUNDARY_OUT"
          python -m py_compile audits/ppo_boundary/prepare.py audits/ppo_boundary/compare.py audits/ppo_boundary/matched.py
          python audits/ppo_boundary/prepare.py 2>&1 | tee "$PPO_BOUNDARY_OUT/prepare.log"
      - name: Check the actual Rust sources and collect fixed traces
        run: |
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$PPO_BOUNDARY_OUT/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib 2>&1 | tee "$PPO_BOUNDARY_OUT/unit-tests.log"
          cargo test --locked --release -p rust_robotics_train --lib trainer::boundary_probe::emit_ppo_boundary_trace -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$PPO_BOUNDARY_OUT/trace.log"
          grep -F 'BOUNDARY TRACE COMPLETE default-201' "$PPO_BOUNDARY_OUT/trace.log"
          grep -F 'BOUNDARY TRACE COMPLETE default-204' "$PPO_BOUNDARY_OUT/trace.log"
          grep -F 'BOUNDARY TRACE COMPLETE timeouts-pool-201' "$PPO_BOUNDARY_OUT/trace.log"
          grep -F 'BOUNDARY TRACE COMPLETE terminals-pool-201' "$PPO_BOUNDARY_OUT/trace.log"
          cargo fmt --all -- --check
          git diff --check
      - name: Install the pinned independent implementation
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee /tmp/ppo-boundary/install-torch.log
          python -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0 2>&1 | tee /tmp/ppo-boundary/install-reference.log
          python -m pip freeze > /tmp/ppo-boundary/python-freeze.txt
      - name: Replay real collector and persistent optimizer boundaries
        run: |
          python audits/ppo_boundary/matched.py --input "$PPO_BOUNDARY_OUT" --output /tmp/ppo-boundary/reference 2>&1 | tee /tmp/ppo-boundary/comparison.log
      - name: Retain every result and verify protected source restoration
        if: always()
        run: |
          mkdir -p /tmp/ppo-boundary
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/ppo-boundary')
          manifest = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'manifest.json'}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          git restore -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/ppo_rollout_pool.rs
          git diff --exit-code ff4934a636974727632355371f575e651dc44a61 -- rust_robotics_train rust_robotics_core rust_robotics_algo rust_robotics_sim Cargo.lock docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ppo-boundary/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
