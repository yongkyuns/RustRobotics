name: Experimental Gaussian force amplification

on:
  push:
    branches: ["experiment/ppo-cleanrl-native-reference"]
    paths: [".github/workflows/cleanrl-gaussian-force-gain.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-ppo-cleanrl-experiment-v1
      - name: Prepare evidence
        run: |
          mkdir -p gaussian-force-gain-evidence
          git rev-parse HEAD > gaussian-force-gain-evidence/source-sha.txt
          rustc --version >> gaussian-force-gain-evidence/source-sha.txt
      - name: Validate source before running
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p rust_robotics_train --features cleanrl-reference --lib cleanrl_reference:: -- --nocapture
          cargo clippy --locked -p rust_robotics_train --features cleanrl-reference --lib --tests --examples -- -D warnings
      - name: Save rustfmt patch if needed
        if: failure()
        run: |
          cargo fmt --all
          git diff -- rust_robotics_train > gaussian-force-gain-evidence/rustfmt.patch
      - name: Build once
        run: cargo build --locked --release -p rust_robotics_train --features cleanrl-reference --example cleanrl_gaussian_force_gain
      - name: Train four Gaussian seeds and evaluate all frozen force conditions
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/examples/cleanrl_gaussian_force_gain gaussian-force-gain-evidence \
            2>&1 | tee gaussian-force-gain-evidence/run.log
      - name: Verify output completeness and nominal Gaussian baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, collections, itertools, hashlib, os
          from pathlib import Path
          folder=Path('gaussian-force-gain-evidence')
          def read(name):
              with (folder/name).open(newline='') as stream:
                  reader=csv.DictReader(stream)
                  reader.fieldnames=[x.strip() for x in reader.fieldnames]
                  return list(reader)
          rows=read('episodes.csv')
          trace=read('witness-traces.csv')
          seeds=(201,202,203,204)
          effects=('ideal','boost_1p5','boost_2p0','bang_bang_sign')
          modes=('deterministic','stochastic')
          panels=('ordinary','difficult')
          groups=collections.defaultdict(list)
          for row in rows:
              group=(int(row['seed']),row['actuator'],row['mode'],row['panel'])
              assert int(row['updates'])==976
              assert row['completed'] in ('true','false')
              assert 1<=int(row['steps'])<=1500
              groups[group].append(row)
          assert len(rows)==4096
          assert set(groups)==set(itertools.product(seeds,effects,modes,panels))
          keys={}
          for group,subset in groups.items():
              assert len(subset)==64 and len({r['key'] for r in subset})==64
              panel=group[3]
              panelkeys=tuple(sorted(int(r['key']) for r in subset))
              if panel in keys:
                  assert keys[panel]==panelkeys
              else:
                  keys[panel]=panelkeys
          old_difficult={201:(54,53),202:(56,55),203:(59,58),204:(48,44)}
          old_ordinary={201:(64,64),202:(64,64),203:(64,64),204:(63,63)}
          for seed in seeds:
              for m,mode in enumerate(modes):
                  for panel,target in (('difficult',old_difficult),('ordinary',old_ordinary)):
                      n=sum(x['completed']=='true' for x in groups[(seed,'ideal',mode,panel)])
                      assert n==target[seed][m],(seed,mode,panel,n)
          traces=collections.defaultdict(list)
          for row in trace:
              assert int(row['key'])==4100100015
              assert abs(float(row['actuator_force_n']))<=20.0001
              traces[(int(row['seed']),row['actuator'],row['mode'])].append(row)
          assert len(traces)==32
          for (seed,effect,mode),t in traces.items():
              matched=[r for r in groups[(seed,effect,mode,'difficult')]
                       if r['key']=='4100100015']
              assert len(matched)==1 and len(t)==int(matched[0]['steps'])
              assert [int(r['tick']) for r in t]==list(range(1,len(t)+1))
              assert t[-1]['terminated']==matched[0]['terminated']
          output=['# Frozen Gaussian force-amplification results','',
                  'Success means all data exist; not an acceptance criterion.','',
                  '| Force transformation | Seed | Ordinary det | Ordinary stoch | Difficult det | Difficult stoch |',
                  '| :-- | --: | --: | --: | --: | --: |']
          for effect in effects:
              for seed in seeds:
                  scores=[f'{sum(r["completed"]=="true" for r in groups[(seed,effect,m,p)])}/64'
                          for p in panels for m in modes]
                  output.append(f'| {effect} | {seed} | '+' | '.join(scores)+' |')
          output+=['',f'{len(rows)} evaluation episodes and {len(trace)} witness ticks verified.',
                   'Each Gaussian training seed received the original 976 updates / 499712 training interactions.',
                   'Interventions were evaluation-only, with no fresh training seeds or policy optimization.']
          report='\n'.join(output)+'\n'
          (folder/'summary.md').write_text(report)
          for name in ('episodes.csv','witness-traces.csv'):
              digest=hashlib.sha256((folder/name).read_bytes()).hexdigest()
              with (folder/'source-sha.txt').open('a') as f:
                  f.write(f'{name}_sha256={digest}\n')
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(report)
          PY
      - name: Preserve all evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ppo-gaussian-force-gain
          path: gaussian-force-gain-evidence/
          retention-days: 14
          if-no-files-found: warn
