name: Bootstrap audited lockfile

on:
  push:
    branches: ["polish/tutorial-correctness-pass"]

permissions:
  contents: write

jobs:
  commit-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/tutorial-correctness-pass

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate workspace lockfile
        run: cargo generate-lockfile

      - name: Commit resolved lockfile when changed
        run: |
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Track audited Cargo lockfile"
          git push origin HEAD:polish/tutorial-correctness-pass
