name: PPO checkpoint replay (evaluation only)
on:
  push:
    branches: [audit/ppo-clean-reference-20260925]
    paths: [.github/workflows/ppo-checkpoint-replay.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ppo-checkpoint-replay-20261006
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare evidence paths
        run: |
          mkdir -p /tmp/ppo-checkpoint-replay/raw
          git rev-parse HEAD > /tmp/ppo-checkpoint-replay/executed-commit.txt
          cp audits/clean_reference/replay_checkpoints_20261006.py /tmp/ppo-checkpoint-replay/
          cp .github/workflows/ppo-checkpoint-replay.yml /tmp/ppo-checkpoint-replay/
      - name: Install original numeric and reference versions
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee /tmp/ppo-checkpoint-replay/install-torch.log
          python -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0 2>&1 | tee /tmp/ppo-checkpoint-replay/install-reference.log
          python -m pip freeze > /tmp/ppo-checkpoint-replay/python-freeze.txt
      - name: Retrieve original artifact ZIPs without changing the frozen run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for item in '10860907319 clean-ppo-native' '10861158675 clean-ppo-sb3-defaults-201' '10861264695 clean-ppo-sb3-defaults-202' '10861594419 clean-ppo-sb3-defaults-203' '10861629444 clean-ppo-sb3-defaults-204'; do
            read -r id name <<< "$item"
            curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "/tmp/ppo-checkpoint-replay/raw/${name}.zip"
          done
      - name: Require exact original and instrumented outcomes before interpreting traces
        run: |
          python audits/clean_reference/replay_checkpoints_20261006.py --raw /tmp/ppo-checkpoint-replay/raw --output /tmp/ppo-checkpoint-replay 2>&1 | tee /tmp/ppo-checkpoint-replay/replay.log
          grep -F 'COMPLETE EXACT REPLAY' /tmp/ppo-checkpoint-replay/replay.log
      - name: Record all evidence including any failures
        if: always()
        run: |
          mkdir -p /tmp/ppo-checkpoint-replay
          git diff --exit-code
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('/tmp/ppo-checkpoint-replay')
          (p/'manifest.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and f!=p/'manifest.json'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-checkpoint-replay-20261006
          path: /tmp/ppo-checkpoint-replay/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
