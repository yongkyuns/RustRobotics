name: PPO exact Adam-state correctness audit

on:
  push:
    branches: ["audit/ppo-adam-state-20260921"]
    paths:
      - ".github/workflows/ppo-adam-state-audit.yml"
      - "audits/adam_state_audit/**"

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      ADAM_AUDIT_BUILD: /tmp/adam-build
      HORIZON_BUILD: /tmp/adam-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Attach observation-only optimizer-state hooks and run native controls
        run: |
          mkdir -p "$ADAM_AUDIT_BUILD"
          python audits/adam_state_audit/prepare.py 2>&1 | tee "$ADAM_AUDIT_BUILD/preparation.log"
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$ADAM_AUDIT_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee "$ADAM_AUDIT_BUILD/native-tests.log"
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics 2>&1 | tee "$ADAM_AUDIT_BUILD/integration.log"
          cargo fmt --all -- --check
          git diff --check
      - name: Export the exact tested endpoint
        run: |
          cargo test --locked --release -p rust_robotics_train --lib --no-run --message-format=json > "$ADAM_AUDIT_BUILD/build.jsonl"
          python - <<'PY'
          import json,os,shutil,subprocess
          from pathlib import Path
          out=Path(os.environ["ADAM_AUDIT_BUILD"])
          rows=[json.loads(x) for x in (out/"build.jsonl").read_text().splitlines()]
          found=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("executable") and r["target"]["name"]=="rust_robotics_train"]
          assert len(found)==1,found
          shutil.copyfile(found[0],out/"runner");(out/"runner").chmod(0o755)
          listed=subprocess.check_output([str(out/"runner"),"--list"]).decode()
          (out/"test-list.txt").write_text(listed)
          endpoints=[x.removesuffix(": test") for x in listed.splitlines() if x.endswith("::emit_adam_state_audit: test")]
          assert len(endpoints)==1,endpoints
          (out/"endpoint.txt").write_text(endpoints[0]+"\n")
          (out/"linkage.txt").write_bytes(subprocess.check_output(["ldd",str(out/"runner")]))
          PY
      - name: Preserve build evidence and restore protected source
        if: always()
        run: |
          mkdir -p "$ADAM_AUDIT_BUILD"
          git restore -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/ppo_rollout_pool.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_core rust_robotics_algo rust_robotics_sim Cargo.lock docs
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["ADAM_AUDIT_BUILD"])
          (root/"manifest.json").write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob("*")) if p.is_file() and p.name!="manifest.json"},sort_keys=True,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adam-state-build
          path: /tmp/adam-build/
          retention-days: 30
          if-no-files-found: error

  replay:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ADAM_AUDIT_OUT: /tmp/adam-audit
      ADAM_AUDIT_PRIOR: /tmp/adam-prior
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adam-state-build
          path: /tmp/adam-build
      - name: Verify build and immutable historical witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess,zipfile
          build=Path("/tmp/adam-build");out=Path(os.environ["ADAM_AUDIT_OUT"]);prior=Path(os.environ["ADAM_AUDIT_PRIOR"])
          out.mkdir(parents=True,exist_ok=True);prior.mkdir(parents=True,exist_ok=True)
          for n,h in json.loads((build/"manifest.json").read_text()).items():
              assert hashlib.sha256((build/n).read_bytes()).hexdigest()==h,n
          for n in ["commit.txt","manifest.json","endpoint.txt"]: shutil.copyfile(build/n,out/("build-"+n))
          artifact=10620305749
          digest="c6ed988a1d4a293b11c5037a8c9886afb31ab83c5b45cb2549427d559b462b96"
          raw=out/"regression-window-41006.zip"
          with raw.open("wb") as f:
              subprocess.run(["gh","api",f"repos/yongkyuns/RustRobotics/actions/artifacts/{artifact}/zip"],stdout=f,check=True)
          assert hashlib.sha256(raw.read_bytes()).hexdigest()==digest
          with zipfile.ZipFile(raw) as z:
              manifest=json.loads(z.read("manifest.json"))
              assert set(z.namelist())==set(manifest)|{"manifest.json"}
              for n,h in manifest.items(): assert hashlib.sha256(z.read(n)).hexdigest()==h,n
              for cp in [4139,4140]:
                  for kind in ["actor","critic"]:
                      name=f"{kind}-{cp}.bin";(prior/name).write_bytes(z.read(name))
              # Retain the old optimizer trace for post-hoc independent comparison.
              for step in range(1,17):
                  for name in [f"update-4140/optimizer/step-{step}.json",f"update-4140/optimizer/actor-{step}.bin",f"update-4140/optimizer/critic-{step}.bin"]:
                      d=out/"old"/name;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(z.read(name))
              for name in ["update-4140/batch.json","update-4140/union.json"]:
                  d=out/"old"/name;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(z.read(name))
          (out/"source.json").write_text(json.dumps({"artifact_id":artifact,"sha256":digest,"run":35554192268,"seed":41006,"update":4140},sort_keys=True,indent=2)+"\n")
          PY
          chmod +x /tmp/adam-build/runner
      - name: Replay exact history and capture gradients plus Adam moments
        run: |
          /tmp/adam-build/runner "$(cat /tmp/adam-build/endpoint.txt)" --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$ADAM_AUDIT_OUT/execution.log"
          grep -F "ADAM STATE AUDIT COMPLETE 41006 4140" "$ADAM_AUDIT_OUT/execution.log"
      - name: Preserve all evidence
        if: always()
        run: |
          mkdir -p "$ADAM_AUDIT_OUT"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["ADAM_AUDIT_OUT"])
          (root/"manifest.json").write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob("*")) if p.is_file() and p.name!="manifest.json"},sort_keys=True,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adam-state-41006-4140
          path: /tmp/adam-audit/
          retention-days: 30
          if-no-files-found: error
