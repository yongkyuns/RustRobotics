name: PPO pinned physical-time horizon
on:
  push:
    branches: [audit/ppo-clean-reference-20260925]
    paths:
      - .github/workflows/ppo-physical-horizon.yml
      - audits/clean_reference/physical_horizon_compare.py
permissions:
  contents: read
  actions: read
jobs:
  pair:
    strategy:
      fail-fast: false
      matrix:
        seed: [201, 202, 203, 204]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Recover immutable runtime and native inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pinned runtime evidence/inputs evidence/provenance
          gh api repos/${{ github.repository }}/actions/artifacts/11441687522/zip > runtime.zip
          echo '7418edd50c11ae67ef761610a15c4a0c6ee70f2d3fa032609d6394eb745b5dd1  runtime.zip' | sha256sum -c -
          unzip -q runtime.zip -d pinned
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('pinned')
          manifest=json.loads((root/'manifest.json').read_text())
          for name,digest in manifest.items():
              path=root/name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          print('Verified runtime payloads:',len(manifest))
          PY
          tar -xzf pinned/python311.tar.gz -C runtime
          runtime/python/bin/python3.11 -m pip install --no-index --find-links pinned/wheels 'numpy==2.2.6' 'torch==2.8.0+cpu' 'stable-baselines3==2.9.0' 'gymnasium==1.3.0' 2>&1 | tee evidence/provenance/install.log
          gh api repos/${{ github.repository }}/actions/artifacts/11441435840/zip > pair201.zip
          echo '22ea3b48e60b8199131fd5379e859017cc7b5212d58bbb5c06cb5b52166ce86c  pair201.zip' | sha256sum -c -
          unzip -p pair201.zip native.zip > evidence/inputs/native.zip
          echo '58af5206058b24a8cd39c2665d9bc187200a4e8acaf3841a367d27731e09cdc0  evidence/inputs/native.zip' | sha256sum -c -
          cp pinned/manifest.json evidence/provenance/runtime-payloads.json
          cp .github/workflows/ppo-physical-horizon.yml evidence/provenance/workflow.yml
          git rev-parse HEAD > evidence/provenance/commit.txt
          sha256sum audits/clean_reference/physical_horizon_compare.py audits/clean_reference/paired_pool_20261006.py runtime.zip evidence/inputs/native.zip > evidence/provenance/input-sha256.txt
      - name: Validate pinned runtime, stock GAE, truncation and observer isolation
        shell: bash
        run: |
          set -euo pipefail
          runtime/python/bin/python3.11 audits/clean_reference/physical_horizon_compare.py preflight --raw evidence/inputs/native.zip --out evidence/preflight 2>&1 | tee evidence/preflight.log
      - name: Run both fixed-budget arms on this same host
        shell: bash
        run: |
          set -euo pipefail
          runtime/python/bin/python3.11 audits/clean_reference/physical_horizon_compare.py measure --raw evidence/inputs/native.zip --out evidence/pair --seed ${{ matrix.seed }} 2>&1 | tee evidence/measurement.log
      - name: Retain success or failure payload manifest
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('evidence')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p!=root/'MANIFEST.json'}
          (root/'MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ppo-physical-horizon-${{ matrix.seed }}-${{ github.run_id }}
          path: evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
