name: One-time experimental PPO rustfmt

on:
  push:
    branches: ["experiment/ppo-cleanrl-native-reference"]
    paths: [".github/workflows/format-cleanrl-native-reference.yml"]

permissions:
  contents: write

jobs:
  format-prototype:
    name: Apply rustfmt to experimental native PPO sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format only the feature-gated reference implementation
        run: |
          rustfmt --edition 2021 rust_robotics_train/src/cleanrl_reference.rs
          rustfmt --edition 2021 rust_robotics_train/src/cleanrl_reference_parity_tests.rs
          rustfmt --edition 2021 rust_robotics_train/examples/cleanrl_reference_cohort.rs
          git add -- rust_robotics_train/src/cleanrl_reference.rs rust_robotics_train/src/cleanrl_reference_parity_tests.rs rust_robotics_train/examples/cleanrl_reference_cohort.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format experimental native CleanRL PPO sources"
            git push origin HEAD:refs/heads/experiment/ppo-cleanrl-native-reference
          fi
