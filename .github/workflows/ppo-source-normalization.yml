name: PPO source-normalization comparison
on:
  push:
    branches: ["audit/ppo-source-normalization-20260919"]
    paths: [".github/workflows/ppo-source-normalization.yml", "audits/source_normalization/native.rs", "audits/source_normalization/prepare.py"]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      HORIZON_BUILD: /tmp/source-normalization-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Require unchanged collection and normalization-isolation controls
        run: |
          mkdir -p "$HORIZON_BUILD"
          python audits/source_normalization/prepare.py 2>&1 | tee "$HORIZON_BUILD/preparation.log"
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$HORIZON_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee "$HORIZON_BUILD/tests.log"
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics 2>&1 | tee "$HORIZON_BUILD/integration.log"
          cargo fmt --all -- --check
          git diff --check
      - name: Export exactly the tested native endpoint
        run: |
          cargo test --locked --release -p rust_robotics_train --lib --no-run --message-format=json > "$HORIZON_BUILD/build.jsonl"
          python - <<'PY'
          from pathlib import Path
          import json,os,shutil
          root=Path(os.environ['HORIZON_BUILD'])
          rows=[json.loads(l) for l in (root/'build.jsonl').read_text().splitlines()]
          binaries=[r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('executable') and r['target']['name']=='rust_robotics_train']
          assert len(binaries)==1,binaries
          shutil.copyfile(binaries[0],root/'runner')
          PY
          chmod +x "$HORIZON_BUILD/runner"
          ldd "$HORIZON_BUILD/runner" > "$HORIZON_BUILD/linkage.txt"
      - name: Preserve all outcomes and restore protected source
        if: always()
        run: |
          mkdir -p "$HORIZON_BUILD"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['HORIZON_BUILD'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2,sort_keys=True)+'\n')
          PY
          git restore -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/ppo_rollout_pool.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_core rust_robotics_algo rust_robotics_sim Cargo.lock docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-normalization-build
          path: /tmp/source-normalization-build/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
  measure:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [41001,41002,41003,41004,41005,41006,41007,41008]
    name: Normalization seed ${{ matrix.seed }}
    env:
      HORIZON_SEED: ${{ matrix.seed }}
      HORIZON_BUILD: /tmp/source-normalization-build
      HORIZON_OUT: /tmp/source-normalization-${{ matrix.seed }}
      HORIZON_PRIOR: /tmp/source-normalization-prior
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-normalization-build
          path: /tmp/source-normalization-build
      - name: Verify exact runner and immutable outward-mixture evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HORIZON_OUT" "$HORIZON_PRIOR"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess,zipfile
          root=Path(os.environ['HORIZON_BUILD']);out=Path(os.environ['HORIZON_OUT']);prior=Path(os.environ['HORIZON_PRIOR'])
          for n,h in json.loads((root/'manifest.json').read_text()).items():assert hashlib.sha256((root/n).read_bytes()).hexdigest()==h,n
          for n in ['manifest.json','commit.txt','baseline.txt']:shutil.copyfile(root/n,out/('build-'+n))
          ids={
            41001:(10589991036,'037f38d0144f4fc6bccb4d80b2625e62b815590be41a84bd27f3c19babba1b52'),
            41002:(10590530489,'2fc327541ece0d45d134f41bcebacc17434306640d9aef539e960fd71084deee'),
            41003:(10589099527,'3438991e612508d61ff7572359b610aab292a5359928297bc1548ea825ea503f'),
            41004:(10589871712,'02e99be00f7e59d45b58b63fea2725969303c148fd8d7689a866296d932fc8c1'),
            41005:(10590395663,'1174a208e9156eb58f73eb2531d52754f92000483f973d04eb0966482e1c9d74'),
            41006:(10588934801,'e96f0f085543875ec8ac80ec6245abff5688914c2cef08c63235904bc936466c'),
            41007:(10589881550,'be43d7761ccca57207b896521ed1157184336ecbbd2fba8b04bfb899ee46867d'),
            41008:(10588899995,'3fbbc68cf0d4e4e4ecaa785abe144b0745bef19498f4bd13f9c027880728bc9c')}
          artifact,digest=ids[int(os.environ['HORIZON_SEED'])]
          archive=Path('/tmp/original-outward.zip')
          with archive.open('wb') as f:subprocess.run(['gh','api',f'repos/yongkyuns/RustRobotics/actions/artifacts/{artifact}/zip'],stdout=f,check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest
          wanted=['actor-0.bin','critic-0.bin','prefix-costs.json','evaluation.csv']+[f'half-outward/{kind}-{cp}.bin' for kind in ['actor','critic'] for cp in [32,128,512]]
          with zipfile.ZipFile(archive) as z:
              manifest=json.loads(z.read('manifest.json'));assert set(z.namelist())==set(manifest)|{'manifest.json'}
              for n,h in manifest.items():assert hashlib.sha256(z.read(n)).hexdigest()==h,n
              (out/'prior-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
              for n in wanted:
                  p=prior/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
                  retained=out/'prior-input'/n;retained.parent.mkdir(parents=True,exist_ok=True);retained.write_bytes(z.read(n))
          (out/'prior-source.json').write_text(json.dumps({'artifact':artifact,'sha256':digest,'verified_all_members':len(manifest)},indent=2)+'\n')
          PY
          chmod +x "$HORIZON_BUILD/runner"
      - name: Execute historical replay and three fixed continuations
        run: |
          "$HORIZON_BUILD/runner" trainer::horizon_audit::tail_support::recovery_anchor::recovery_rewards::repeated_recovery::outward_mix::source_normalization::emit_source_normalization --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$HORIZON_OUT/execution.log"
          grep -F "SOURCE NORMALIZATION COMPLETE $HORIZON_SEED" "$HORIZON_OUT/execution.log"
      - name: Preserve every result or failure
        if: always()
        run: |
          mkdir -p "$HORIZON_OUT"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['HORIZON_OUT'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-normalization-${{ matrix.seed }}
          path: ${{ env.HORIZON_OUT }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
