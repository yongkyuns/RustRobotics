name: PPO learned-baseline live-step replay

on:
  push:
    branches: ["audit/ppo-learned-baseline-live-step-20260922"]
    paths:
      - ".github/workflows/ppo-learned-baseline-live-step.yml"
      - "audits/learned_baseline_live/**"
      - "audits/baseline_attribution/analyze.py"
      - "audits/critic_generalization/study.py"

concurrency:
  group: ppo-learned-baseline-live-step-20260922
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      LEARNED_BASELINE_BUILD: /tmp/learned-baseline-build
      HORIZON_BUILD: /tmp/learned-baseline-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Attach learned-baseline child and run native controls
        run: |
          mkdir -p "$LEARNED_BASELINE_BUILD"
          python audits/learned_baseline_live/prepare.py 2>&1 | tee "$LEARNED_BASELINE_BUILD/preparation.log"
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$LEARNED_BASELINE_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee "$LEARNED_BASELINE_BUILD/native-tests.log"
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics 2>&1 | tee "$LEARNED_BASELINE_BUILD/integration.log"
          cargo fmt --all -- --check
          git diff --check
      - name: Export exact tested endpoint
        run: |
          cargo test --locked --release -p rust_robotics_train --lib --no-run --message-format=json > "$LEARNED_BASELINE_BUILD/build.jsonl"
          python - <<'PY'
          import json,os,shutil,subprocess
          from pathlib import Path
          out=Path(os.environ["LEARNED_BASELINE_BUILD"])
          rows=[json.loads(line) for line in (out/"build.jsonl").read_text().splitlines()]
          bins=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("executable") and r["target"]["name"]=="rust_robotics_train"]
          assert len(bins)==1,bins
          shutil.copyfile(bins[0],out/"runner");(out/"runner").chmod(0o755)
          listed=subprocess.check_output([str(out/"runner"),"--list"]).decode().splitlines()
          endpoints=[line.removesuffix(": test") for line in listed if line.endswith("::emit_learned_baseline_live_step: test")]
          assert len(endpoints)==1,endpoints
          (out/"endpoint.txt").write_text(endpoints[0]+"\n")
          PY
          ldd "$LEARNED_BASELINE_BUILD/runner" > "$LEARNED_BASELINE_BUILD/linkage.txt"
      - name: Preserve build evidence and restore protected source
        if: always()
        run: |
          git restore -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/ppo_rollout_pool.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_core rust_robotics_algo rust_robotics_sim Cargo.lock docs
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["LEARNED_BASELINE_BUILD"]);root.mkdir(parents=True,exist_ok=True)
          (root/"manifest.json").write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob("*")) if p.is_file() and p.name!="manifest.json"},sort_keys=True,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learned-baseline-build
          path: /tmp/learned-baseline-build/
          retention-days: 30
          if-no-files-found: error

  values:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VALUE_OUT: /tmp/learned-baseline-values
      FIT_OUT: /tmp/critic-generalization-repro
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install exact pilot numerical stack
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Download and verify frozen independent-future evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/critic-input "$VALUE_OUT"
          gh api repos/yongkyuns/RustRobotics/actions/artifacts/10698150266/zip > /tmp/critic-input/result.zip
          gh api repos/yongkyuns/RustRobotics/actions/artifacts/10697715468/zip > /tmp/critic-input/build.zip
          echo "795f94bdfbd7246a0ad99ac0d0c9b9085c364abad948b2532dab3b4c48b09b3d  /tmp/critic-input/result.zip" | sha256sum -c -
          echo "cceee910794ac637cb2e7ce4c01e976fb95635fb045fd383229683444913c1b7  /tmp/critic-input/build.zip" | sha256sum -c -
      - name: Reproduce fixed pilot checkpoints before native use
        run: |
          python audits/critic_generalization/study.py /tmp/critic-input/result.zip /tmp/critic-input/build.zip --out "$FIT_OUT" 2>&1 | tee "$VALUE_OUT/fitting.log"
          echo "9bc8227044ec12d1a7faa38d351c4ae3a2972deaaeefd98fdce51e5a5e8f41ba  $FIT_OUT/independent-uniform/critic-4096.bin" | sha256sum -c -
          echo "e5d717c4ee1ca340906cb4acc35d373bd3b070a26d70bfe5ac15c78997679096  $FIT_OUT/independent-early-balanced/critic-4096.bin" | sha256sum -c -
      - name: Freeze exact f32 witness predictions
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,sys
          import numpy as np
          import torch
          sys.path.insert(0, ".")
          from audits.critic_generalization import study
          inp=study.load_inputs(Path("/tmp/critic-input/result.zip"),Path("/tmp/critic-input/build.zip"))
          fit=Path(os.environ["FIT_OUT"]); out=Path(os.environ["VALUE_OUT"])
          expected={
            "learned-uniform":("independent-uniform","8d2cdd410a6247ae08e88eb228e21baf08349a932db8941a2062c892e7d8a937"),
            "learned-early-balanced":("independent-early-balanced","e62cfcc96f3458cc74ff7e17110f1c55ac759d63f132381a27c274c741ecf12d"),
          }
          records={}
          for label,(arm,digest) in expected.items():
              flat=np.fromfile(fit/arm/"critic-4096.bin",dtype="<f4")
              model=study.Critic(flat)
              with torch.no_grad():
                  pred=model(torch.tensor(inp.witness.x,dtype=torch.float32)).cpu().numpy().astype("<f4")
              assert pred.shape==(1024,) and np.isfinite(pred).all()
              path=out/f"{label}.bin"; path.write_bytes(pred.tobytes())
              got=hashlib.sha256(path.read_bytes()).hexdigest()
              assert got==digest,(label,got,digest)
              records[label]={"rows":1024,"sha256":got,"critic_sha256":hashlib.sha256((fit/arm/"critic-4096.bin").read_bytes()).hexdigest()}
              (out/f"{label}-critic-4096.bin").write_bytes((fit/arm/"critic-4096.bin").read_bytes())
          (out/"source.json").write_text(json.dumps({
              "protocol_issue_comment":5780978113,
              "critic_generalization_commit":"2041920154d914119cf8cacb95be2b0a39c73b73",
              "source_result_artifact":10698150266,
              "source_build_artifact":10697715468,
              "records":records,
          },sort_keys=True,indent=2)+"\n")
          (out/"pilot-report.json").write_bytes((fit/"report.json").read_bytes())
          PY
      - name: Preserve value evidence
        if: always()
        run: |
          mkdir -p "$VALUE_OUT"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["VALUE_OUT"])
          (root/"manifest.json").write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob("*")) if p.is_file() and p.name!="manifest.json"},sort_keys=True,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learned-baseline-values
          path: /tmp/learned-baseline-values/
          retention-days: 30
          if-no-files-found: error

  measure:
    needs: [preflight, values]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEARNED_BASELINE_BUILD: /tmp/learned-baseline-build
      LEARNED_BASELINE_VALUES_DIR: /tmp/learned-baseline-values
      LEARNED_BASELINE_OUT: /tmp/learned-baseline-out
      LEARNED_BASELINE_PRIOR: /tmp/learned-baseline-prior
      LEARNED_BASELINE_UNIFORM_VALUES: /tmp/learned-baseline-values/learned-uniform.bin
      LEARNED_BASELINE_BALANCED_VALUES: /tmp/learned-baseline-values/learned-early-balanced.bin
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: learned-baseline-build
          path: /tmp/learned-baseline-build
      - uses: actions/download-artifact@v4
        with:
          name: learned-baseline-values
          path: /tmp/learned-baseline-values
      - name: Verify build, learned baselines and historical source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$LEARNED_BASELINE_OUT" "$LEARNED_BASELINE_PRIOR"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,zipfile,shutil
          for env in ["LEARNED_BASELINE_BUILD","LEARNED_BASELINE_VALUES_DIR"]:
              root=Path(os.environ[env])
              for name,digest in json.loads((root/"manifest.json").read_text()).items():
                  assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          assert hashlib.sha256(Path(os.environ["LEARNED_BASELINE_UNIFORM_VALUES"]).read_bytes()).hexdigest()=="8d2cdd410a6247ae08e88eb228e21baf08349a932db8941a2062c892e7d8a937"
          assert hashlib.sha256(Path(os.environ["LEARNED_BASELINE_BALANCED_VALUES"]).read_bytes()).hexdigest()=="e62cfcc96f3458cc74ff7e17110f1c55ac759d63f132381a27c274c741ecf12d"

          raw=Path("/tmp/paired-credit-41006.zip")
          with raw.open("wb") as f:
              subprocess.run(["gh","api","repos/yongkyuns/RustRobotics/actions/artifacts/10638379259/zip"],stdout=f,check=True)
          digest="65e071b04fa23f550a8be4cc306c05ccfe7d76eec0dfc6e7e1bab21cb3698ece"
          assert hashlib.sha256(raw.read_bytes()).hexdigest()==digest
          prior=Path(os.environ["LEARNED_BASELINE_PRIOR"])
          with zipfile.ZipFile(raw) as z:
              manifest=json.loads(z.read("manifest.json"))
              assert set(z.namelist())==set(manifest)|{"manifest.json"}
              for name,h in manifest.items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==h,name
              for name in z.namelist():
                  if name.startswith("reference/") and not name.endswith("/"):
                      dest=prior/name.removeprefix("reference/")
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(z.read(name))
          out=Path(os.environ["LEARNED_BASELINE_OUT"])
          shutil.copyfile(raw,out/"historical-source.zip")
          shutil.copyfile(Path(os.environ["LEARNED_BASELINE_VALUES_DIR"])/"source.json",out/"learned-baseline-source.json")
          PY
          chmod +x "$LEARNED_BASELINE_BUILD/runner"
      - name: Replay exact harmful update with learned baselines
        run: |
          endpoint=$(cat "$LEARNED_BASELINE_BUILD/endpoint.txt")
          "$LEARNED_BASELINE_BUILD/runner" "$endpoint" --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$LEARNED_BASELINE_OUT/execution.log"
          grep -F "LEARNED BASELINE LIVE STEP COMPLETE 41006 4140" "$LEARNED_BASELINE_OUT/execution.log"
      - name: Summarize fixed paired evaluation
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,math,os,statistics,collections
          out=Path(os.environ["LEARNED_BASELINE_OUT"])
          rows=list(csv.DictReader((out/"evaluation.csv").open()))
          assert len(rows)==6144
          arms=["incoming","original","learned-uniform","learned-early-balanced"]
          panels=["reset-det","reset-stoch","outward-stoch"]
          by={(r["arm"],r["panel"],int(r["rep"])):r for r in rows}
          summary={}
          for arm in arms:
              summary[arm]={}
              for panel in panels:
                  p=[by[(arm,panel,i)] for i in range(512)]
                  endings=collections.Counter(r["ending"] for r in p)
                  summary[arm][panel]={
                      "completed":sum(r["ending"]=="timeout" for r in p),
                      "endings":dict(sorted(endings.items())),
                      "mean_discounted":sum(float(r["discounted"]) for r in p)/512.0,
                      "mean_steps":sum(int(r["steps"]) for r in p)/512.0,
                  }
          contrasts={}
          t99=2.586
          for arm in ["original","learned-uniform","learned-early-balanced"]:
              contrasts[arm]={}
              for panel in panels:
                  d=[float(by[(arm,panel,i)]["discounted"])-float(by[("incoming",panel,i)]["discounted"]) for i in range(512)]
                  mean=sum(d)/len(d); se=statistics.stdev(d)/math.sqrt(len(d))
                  contrasts[arm][panel]={"mean_discounted_delta_vs_incoming":mean,"approx_paired_99_ci":[mean-t99*se,mean+t99*se]}
          screens={}
          for arm in ["learned-uniform","learned-early-balanced"]:
              criteria={
                  "nominal_det_completion_not_below_incoming":summary[arm]["reset-det"]["completed"]>=summary["incoming"]["reset-det"]["completed"],
                  "nominal_stoch_completion_not_below_incoming":summary[arm]["reset-stoch"]["completed"]>=summary["incoming"]["reset-stoch"]["completed"],
                  "outward_completion_not_below_incoming":summary[arm]["outward-stoch"]["completed"]>=summary["incoming"]["outward-stoch"]["completed"],
                  "no_panel_confidently_harmful_discounted_return":all(contrasts[arm][p]["approx_paired_99_ci"][1]>=0 for p in panels),
              }
              screens[arm]={"criteria":criteria,"passed":all(criteria.values())}
          report={"summary":summary,"contrasts_vs_incoming":contrasts,"local_screens":screens,"ci_note":"paired mean +/- 2.586*SE; descriptive local diagnostic"}
          (out/"summary.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True,indent=2))
          PY
      - name: Preserve all evidence
        if: always()
        run: |
          mkdir -p "$LEARNED_BASELINE_OUT"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["LEARNED_BASELINE_OUT"])
          (root/"manifest.json").write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob("*")) if p.is_file() and p.name!="manifest.json"},sort_keys=True,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learned-baseline-live-step
          path: /tmp/learned-baseline-out/
          retention-days: 30
          if-no-files-found: error
