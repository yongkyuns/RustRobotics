name: PPO late actor learning-rate decay

on:
  push:
    branches: ["audit/ppo-late-actor-decay-20260918"]
    paths: [".github/workflows/ppo-late-actor-decay.yml", "audits/late_actor_decay/native.rs", "audits/late_actor_decay/prepare.py", "audits/late_actor_decay/run.py"]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      DECAY_BUILD: /tmp/decay-bundle
      DECAY_PRIOR_BUILD: /tmp/decay-prior-build.zip
      PPO_REF_LIBRARY: /tmp/decay-bundle/librust_robotics_train.so
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prior evidence and prepare the isolated rate hook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$DECAY_BUILD"
          gh api repos/yongkyuns/RustRobotics/actions/artifacts/10571679369/zip > "$DECAY_PRIOR_BUILD"
          python audits/late_actor_decay/prepare.py 2>&1 | tee "$DECAY_BUILD/prepare.log"
          python -m py_compile audits/late_actor_decay/prepare.py audits/late_actor_decay/run.py
      - name: Require unchanged native tests and schedule isolation controls
        run: |
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$DECAY_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train -- --test-threads=1 2>&1 | tee "$DECAY_BUILD/native-tests.log"
          cargo build --locked --release -p rust_robotics_train --lib 2>&1 | tee "$DECAY_BUILD/build.log"
          cp target/release/librust_robotics_train.so "$PPO_REF_LIBRARY"
          cargo fmt --all -- --check
          git diff --check
      - name: Install pinned unchanged evaluation runtime
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0
          python -m pip freeze > "$DECAY_BUILD/python-freeze.txt"
      - name: Require native evaluator parity and training isolation
        run: |
          python "$DECAY_BUILD/run.py" controls --out "$DECAY_BUILD/controls" 2>&1 | tee "$DECAY_BUILD/controls.log"
          grep -F 'ACTOR DECAY CONTROLS PASS' "$DECAY_BUILD/controls.log"
      - name: Preserve sources and verify production restoration
        if: always()
        run: |
          mkdir -p "$DECAY_BUILD"
          python - <<'PY'
          import pathlib,hashlib,json,os
          root=pathlib.Path(os.environ['DECAY_BUILD'])
          # Avoid duplicating the verified extracted parent in the artifact.
          import shutil
          if (root/'prior-build').exists(): shutil.rmtree(root/'prior-build')
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2)+'\n')
          PY
          git restore -- rust_robotics_train/Cargo.toml rust_robotics_train/src/lib.rs rust_robotics_train/src/trainer.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_algo rust_robotics_core rust_robotics_train rust_robotics_sim docs Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actor-decay-build
          path: /tmp/decay-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  measure:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    name: Actor rate ${{ matrix.arm }} seed ${{ matrix.seed }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        arm: [constant, actor-decay]
        seed: [201, 202, 203, 204]
    env:
      DECAY_BUILD: /tmp/decay-bundle
      PPO_REF_LIBRARY: /tmp/decay-bundle/librust_robotics_train.so
      DECAY_OUT: /tmp/decay-${{ matrix.arm }}-${{ matrix.seed }}
      DECAY_ARM: ${{ matrix.arm }}
      DECAY_SEED: ${{ matrix.seed }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: actor-decay-build
          path: /tmp/decay-bundle
      - name: Verify exact executable and archived baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$DECAY_OUT"
          chmod +x "$DECAY_BUILD/robustness"
          python - <<'PY'
          import pathlib,hashlib,json,shutil,os,subprocess
          root=pathlib.Path(os.environ['DECAY_BUILD']);out=pathlib.Path(os.environ['DECAY_OUT'])
          for n,h in json.loads((root/'manifest.json').read_text()).items(): assert hashlib.sha256((root/n).read_bytes()).hexdigest()==h,n
          for name in ['manifest.json','audit-commit.txt','run.py','robustness.rs']:
              shutil.copyfile(root/name,out/('build-'+name))
          ids={201:(10573100831,'cf6497a87869145e4d383d4aca9b636467a7a3ab1d0c9a6bf518ce95a6c17c8a'),
               202:(10572855997,'0f8486099c8d68ec58bdcbd40b47a27da5271027ad388299e241735c21442277'),
               203:(10573290549,'caf7dceaeeb59683aef29c54a8122342381b3b18cdcf3a813ae6d7593c6fb998'),
               204:(10572317499,'45dab4e0dfef39ee950898b48bbf9a8b5b137e1b4759a932135081043a0e76a2')}
          artifact,digest=ids[int(os.environ['DECAY_SEED'])]
          with (out/'prior.zip').open('wb') as f:
              subprocess.run(['gh','api',f'repos/yongkyuns/RustRobotics/actions/artifacts/{artifact}/zip'],stdout=f,check=True)
          assert hashlib.sha256((out/'prior.zip').read_bytes()).hexdigest()==digest
          (out/'prior-artifact.json').write_text(json.dumps({'id':artifact,'sha256':digest})+'\n')
          PY
      - name: Install identical pinned short-panel runtime
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0
          python -m pip freeze > "$DECAY_OUT/python-freeze.txt"
      - name: Execute all fixed training budgets and frozen-policy evaluations
        run: |
          python "$DECAY_BUILD/run.py" measure --arm "$DECAY_ARM" --seed "$DECAY_SEED" --prior "$DECAY_OUT/prior.zip" --out "$DECAY_OUT" 2>&1 | tee "$DECAY_OUT/execution.log"
          grep -F 'ACTOR DECAY MEASUREMENT COMPLETE' "$DECAY_OUT/execution.log"
      - name: Retain every outcome and failure
        if: always()
        run: |
          mkdir -p "$DECAY_OUT"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['DECAY_OUT'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actor-decay-${{ matrix.arm }}-${{ matrix.seed }}
          path: ${{ env.DECAY_OUT }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
