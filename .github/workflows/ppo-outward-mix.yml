name: PPO outward-start mixture continuation

on:
  push:
    branches: ["audit/ppo-outward-mix-20260919"]
    paths: [".github/workflows/ppo-outward-mix.yml", "audits/outward_mix/native.rs", "audits/outward_mix/prepare.py"]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: never
      HORIZON_BUILD: /tmp/outward-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Require unchanged recipe and isolated mixture controls
        run: |
          mkdir -p "$HORIZON_BUILD"
          python audits/outward_mix/prepare.py 2>&1 | tee "$HORIZON_BUILD/preparation.log"
          cargo clippy --locked -p rust_robotics_train --all-targets -- -D warnings 2>&1 | tee "$HORIZON_BUILD/clippy.log"
          cargo test --locked --release -p rust_robotics_train --lib -- --test-threads=1 2>&1 | tee "$HORIZON_BUILD/tests.log"
          cargo test --locked --release -p rust_robotics_train --test ppo_learning --test ppo_balancing_diagnostics 2>&1 | tee "$HORIZON_BUILD/integration.log"
          cargo fmt --all -- --check
          git diff --check
      - name: Export the tested native endpoint
        run: |
          cargo test --locked --release -p rust_robotics_train --lib --no-run --message-format=json > "$HORIZON_BUILD/build.jsonl"
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ['HORIZON_BUILD'])
          rows=[json.loads(line) for line in (root/'build.jsonl').read_text().splitlines()]
          binaries=[r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('executable') and r['target']['name']=='rust_robotics_train']
          assert len(binaries)==1,binaries
          shutil.copyfile(binaries[0],root/'runner')
          PY
          chmod +x "$HORIZON_BUILD/runner"
          ldd "$HORIZON_BUILD/runner" > "$HORIZON_BUILD/linkage.txt"
      - name: Preserve all provenance and restore protected files
        if: always()
        run: |
          mkdir -p "$HORIZON_BUILD"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['HORIZON_BUILD'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2)+'\n')
          PY
          git restore -- rust_robotics_train/src/trainer.rs rust_robotics_train/src/ppo_rollout_pool.rs
          git diff --exit-code 4739f370558b9443708c920ac30614f86e3c07bb -- rust_robotics_train rust_robotics_core rust_robotics_algo rust_robotics_sim Cargo.lock docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outward-build
          path: /tmp/outward-build/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  measure:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [41001, 41002, 41003, 41004, 41005, 41006, 41007, 41008]
    name: Outward mixture seed ${{ matrix.seed }}
    env:
      HORIZON_SEED: ${{ matrix.seed }}
      HORIZON_BUILD: /tmp/outward-build
      HORIZON_OUT: /tmp/outward-result
      HORIZON_PRIOR: /tmp/outward-prior
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: outward-build
          path: /tmp/outward-build
      - name: Verify native executable and historical recovery endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HORIZON_OUT" "$HORIZON_PRIOR"
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path
          build=Path(os.environ['HORIZON_BUILD']);out=Path(os.environ['HORIZON_OUT']);prior=Path(os.environ['HORIZON_PRIOR'])
          for n,h in json.loads((build/'manifest.json').read_text()).items(): assert hashlib.sha256((build/n).read_bytes()).hexdigest()==h,n
          for n in ['manifest.json','commit.txt','baseline.txt']:shutil.copyfile(build/n,out/('build-'+n))
          ids={
              41001:(10586884648,'1775a8abfb8108c1c8e22d7f648158f4af95760cb2e4a1d5babfc350479696d5'),
              41002:(10587601850,'290d32e94d51fefc117a9402026bc80a2db4fe4a749eb549ac9c4e3719bd2289'),
              41003:(10587691847,'db2c927a6987e016e5aa652ff7c0f765afdff768bfdb0d6392f6a7b7a32a1519'),
              41004:(10587054534,'cf819e0d190824f78292237f60260e9295f46a88eb32bb5cff4aa50c38c449c6'),
              41005:(10587154734,'8fd8349eee9cf377d40c889d98f5e532463236c198f1e10d6104f8041911238e'),
              41006:(10587079979,'0691ac00cc7b90ae75b6520c08abd29be5f57e290b19e0dad8759300a042599e'),
              41007:(10587442596,'c96f278fd3453c52e2bda93e6843ade3eba84502deaff57f7e6b266963d59d68'),
              41008:(10588490347,'2e3f6a9db8c9365418b1467d6e5debc70b37c07e41cda1d51d5659eca530a393')}
          artifact,digest=ids[int(os.environ['HORIZON_SEED'])]
          path=out/'prior-recovery.zip'
          with path.open('wb') as f:subprocess.run(['gh','api',f'repos/yongkyuns/RustRobotics/actions/artifacts/{artifact}/zip'],stdout=f,check=True)
          assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          with zipfile.ZipFile(path) as z:
              manifest=json.loads(z.read('manifest.json'))
              for n,h in manifest.items():assert hashlib.sha256(z.read(n)).hexdigest()==h,n
              for n in ['actor-4096.bin','critic-4096.bin']:(prior/n).write_bytes(z.read(n))
          (out/'historical-source.json').write_text(json.dumps({'id':artifact,'sha256':digest})+'\n')
          PY
          chmod +x "$HORIZON_BUILD/runner"
      - name: Reconstruct full optimizer history and execute both fixed arms
        run: |
          "$HORIZON_BUILD/runner" trainer::horizon_audit::tail_support::recovery_anchor::recovery_rewards::repeated_recovery::outward_mix::emit_outward_mix --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$HORIZON_OUT/execution.log"
          grep -F "OUTWARD MIX COMPLETE $HORIZON_SEED" "$HORIZON_OUT/execution.log"
      - name: Retain all outcomes including failures
        if: always()
        run: |
          mkdir -p "$HORIZON_OUT"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['HORIZON_OUT'])
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='manifest.json'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outward-mix-${{ matrix.seed }}
          path: /tmp/outward-result/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
