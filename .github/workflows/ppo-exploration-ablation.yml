name: PPO exploration-scale development ablation

on:
  push:
    branches: ["experiment/ppo-action-std-4"]
    paths: [".github/workflows/ppo-exploration-ablation.yml"]

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ppo-learning-release-v1
      - name: Verify unchanged training and diagnostic controls
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ppo-exploration-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/ppo-exploration-evidence/head.txt"
          rustc -Vv | tee "$RUNNER_TEMP/ppo-exploration-evidence/rustc.txt"
          python3 -m unittest discover -s scripts -p 'test_diagnose_ppo_balancing.py' 2>&1 | tee "$RUNNER_TEMP/ppo-exploration-evidence/reader-tests.log"
          cargo test --locked -p rust_robotics_train 2>&1 | tee "$RUNNER_TEMP/ppo-exploration-evidence/training-tests.log"
          cargo fmt --all -- --check
          git diff --exit-code
      - name: Repeat unchanged action_std 2 baseline on this runner
        shell: bash
        run: python3 scripts/diagnose_ppo_balancing.py --output "$RUNNER_TEMP/ppo-exploration-evidence/std2"
      - name: Preserve same-build baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppo-exploration-baseline
          path: ${{ runner.temp }}/ppo-exploration-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Measure action_std 4 and independently compare all outcomes
        shell: bash
        run: |
          python3 scripts/run_ppo_exploration_ablation.py \
            --baseline "$RUNNER_TEMP/ppo-exploration-evidence/std2" \
            --output "$RUNNER_TEMP/ppo-exploration-evidence/ablation"
          git diff --exit-code
      - name: Preserve both panels and all failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppo-exploration-ablation
          path: ${{ runner.temp }}/ppo-exploration-evidence/
          retention-days: 30
          if-no-files-found: error
