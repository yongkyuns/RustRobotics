name: Ordinary PPO fixed-budget pool comparison
on:
  push:
    branches: [audit/ppo-clean-reference-20260925]
    paths: [.github/workflows/ppo-paired-pool.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ppo-paired-pool-20261006
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  PYTHONDONTWRITEBYTECODE: 1
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record exact setup and install original direct dependencies
        run: |
          mkdir -p /tmp/pool-preflight
          git rev-parse HEAD > /tmp/pool-preflight/executed-commit.txt
          cp audits/clean_reference/paired_pool_20261006.py .github/workflows/ppo-paired-pool.yml /tmp/pool-preflight/
          lscpu > /tmp/pool-preflight/lscpu.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee /tmp/pool-preflight/install-torch.log
          python -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0 2>&1 | tee /tmp/pool-preflight/install-reference.log
          python -m pip freeze > /tmp/pool-preflight/python-freeze.txt
      - name: Retrieve the original qualified native binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10860907319/zip" -o /tmp/pool-preflight/native.zip
      - name: Require constructor, RNG, optimizer, stream and independent GAE controls
        run: |
          python audits/clean_reference/paired_pool_20261006.py preflight --raw /tmp/pool-preflight/native.zip --output /tmp/pool-preflight 2>&1 | tee /tmp/pool-preflight/preflight.log
          grep -F 'PREFLIGHT PASS' /tmp/pool-preflight/preflight.log
      - name: Retain all preflight evidence
        if: always()
        run: |
          mkdir -p /tmp/pool-preflight
          git diff --exit-code
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('/tmp/pool-preflight')
          (p/'manifest.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and f!=p/'manifest.json'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-pool-preflight-20261006
          path: /tmp/pool-preflight/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
  pairs:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [201,202,203,204]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record same-worker pair setup and original direct versions
        run: |
          mkdir -p /tmp/pool-pair
          git rev-parse HEAD > /tmp/pool-pair/executed-commit.txt
          cp audits/clean_reference/paired_pool_20261006.py .github/workflows/ppo-paired-pool.yml /tmp/pool-pair/
          lscpu > /tmp/pool-pair/lscpu.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee /tmp/pool-pair/install-torch.log
          python -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0 2>&1 | tee /tmp/pool-pair/install-reference.log
          python -m pip freeze > /tmp/pool-pair/python-freeze.txt
      - name: Retrieve original native artifact for both arms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10860907319/zip" -o /tmp/pool-pair/native.zip
      - name: Execute both ordinary arms with unchanged fixed checkpoints
        env:
          PAIR_SEED: ${{ matrix.seed }}
        run: |
          python audits/clean_reference/paired_pool_20261006.py measure --raw /tmp/pool-pair/native.zip --output /tmp/pool-pair --seed "$PAIR_SEED" 2>&1 | tee /tmp/pool-pair/measurement.log
          grep -F "COMPLETE PAIRED POOL $PAIR_SEED" /tmp/pool-pair/measurement.log
      - name: Preserve complete or failed pair without replacement
        if: always()
        run: |
          mkdir -p /tmp/pool-pair
          git diff --exit-code
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('/tmp/pool-pair')
          (p/'manifest.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and f!=p/'manifest.json'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-pool-pair-${{ matrix.seed }}-20261006
          path: /tmp/pool-pair/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
