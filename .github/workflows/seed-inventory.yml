name: Test randomness inventory

on:
  push:
    branches: ["test/seed-legacy-filter-regressions"]
    paths: [".github/workflows/seed-inventory.yml"]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture tracked code and randomness call sites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, subprocess
          out = Path(os.environ['RUNNER_TEMP']) / 'test-randomness-inventory'
          out.mkdir()
          paths = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          manifest, hits = {}, []
          for name in filter(None, paths):
              p = Path(name)
              selected = (p.suffix == '.rs' or name.startswith('scripts/') or name.startswith('.github/workflows/') or p.name in ('Cargo.toml', 'Cargo.lock', 'AGENTS.md'))
              if not selected or not p.is_file():
                  continue
              data = p.read_bytes()
              target = out / 'sources' / p
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              manifest[name] = hashlib.sha256(data).hexdigest()
              if p.suffix == '.rs':
                  for n, line in enumerate(data.decode('utf-8').splitlines(), 1):
                      if re.search(r'rand|seed|entropy|#\[test\]|cfg\(test\)', line):
                          hits.append(f'{name}:{n}:{line}')
          (out / 'manifest.json').write_text(json.dumps({'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'source_sha256': manifest}, indent=2))
          (out / 'randomness.txt').write_text('\n'.join(hits) + '\n')
          print('\n'.join(hits))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: test-randomness-inventory
          path: ${{ runner.temp }}/test-randomness-inventory/
          if-no-files-found: error
          retention-days: 14
