name: PPO pinned runtime transport (no training)
on:
  push:
    branches: [audit/ppo-clean-reference-20260925]
    paths: [.github/workflows/ppo-portable-runtime.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the already-qualified direct versions
        run: |
          mkdir -p /tmp/ppo-pinned-runtime
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee /tmp/ppo-pinned-runtime/install-torch.log
          python -m pip install numpy==2.2.6 gymnasium==1.3.0 stable-baselines3==2.9.0 2>&1 | tee /tmp/ppo-pinned-runtime/install-reference.log
          python -m pip freeze > /tmp/ppo-pinned-runtime/python-freeze.txt
          python - <<'PY' > /tmp/ppo-pinned-runtime/runtime.json
          import sys,json,torch,numpy,gymnasium,stable_baselines3
          print(json.dumps(dict(python=sys.version,torch=torch.__version__,numpy=numpy.__version__,gymnasium=gymnasium.__version__,sb3=stable_baselines3.__version__),indent=2))
          PY
      - name: Archive relocatable interpreter and installed CPU packages
        run: |
          tar -C "$pythonLocation" -czf /tmp/ppo-pinned-runtime/python311-runtime.tar.gz bin/python3.11 lib/python3.11 lib/libpython3.11.so lib/libpython3.11.so.1.0
          cd /tmp/ppo-pinned-runtime
          sha256sum python311-runtime.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ppo-python311-torch280-cpu-runtime
          path: /tmp/ppo-pinned-runtime/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
